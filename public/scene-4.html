<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weblings Worksuite - Scene 4</title>
    <!-- GSAP via CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/CustomEase.min.js"></script>
    
    <style>
        :root {
            --brand-blue: #0072C4;
            --surface-lighter: #E6F2FF;
            --surface-inverse: #262626;
            --green-accent: #10B981; 
            --slate-navy: #0F172A; 
            --purple: #9333EA; 
            --bg-light: #F4F6F9; 
            --surface-white: #ffffff;
            --border-light: #d9d9d9;
            --text-dark: #262626;
            --text-gray: #595959;
            --red-badge: #EF4444;
        }

        * { box-sizing: border-box; }

        body, html {
            margin: 0;
            padding: 0;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
            background: var(--bg-light) !important;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        .overlay, .mask, body::before, body::after, #world-stage::before, #world-stage::after {
            display: none !important;
        }

        #viewport {
            width: 100vw;
            height: 100vh;
            perspective: 1200px;
            transform-style: preserve-3d;
            position: relative;
            overflow: hidden;
        }
        
        #ambient-bg {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 150vw;
            height: 150vh;
            transform: translate(-50%, -50%);
            background: radial-gradient(circle at center, var(--surface-lighter) 0%, rgba(0, 114, 196, 0.05) 50%, transparent 100%);
            border-radius: 50%;
            filter: blur(80px);
            z-index: 0;
            pointer-events: none;
        }

        #world-stage {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            transform-style: preserve-3d;
            z-index: 10;
            will-change: transform;
        }

        /* Iframe Preloader */
        #preloader {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: var(--slate-navy);
            z-index: 9999;
            display: flex;
            align-items: center;
            justify-content: center;
            will-change: opacity;
        }

        .spinner {
            width: 60px;
            height: 60px;
            border: 4px solid rgba(255, 255, 255, 0.2);
            border-top: 4px solid #fff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        /* Iframe Styles */
        .iframe-wrapper {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 1440px;
            height: 900px;
            margin-top: -450px;
            margin-left: -720px;
            border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.1);
            box-shadow: 0 40px 100px rgba(0,0,0,0.4);
            overflow: hidden;
            background: var(--surface-white);
            will-change: transform, filter;
            transform-style: preserve-3d;
        }

        .iframe-content {
            width: 1440px;
            height: 2500px;
            border: none;
            pointer-events: none;
            transform-origin: center center;
            will-change: transform;
        }
        
        .iframe-content::-webkit-scrollbar {
            display: none;
        }

        /* 3D Overlays Layer */
        .overlay-layer {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            transform-style: preserve-3d;
        }

        /* Deep Work Forcefield */
        .forcefield {
            position: absolute;
            top: 0; left: 0;
            width: 1440px; height: 900px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(4px) brightness(1.1);
            -webkit-backdrop-filter: blur(4px) brightness(1.1);
            border: 1px solid rgba(255, 255, 255, 0.4);
            border-radius: 12px;
            z-index: 5;
            opacity: 0;
            transform: translateZ(10px);
            will-change: transform, opacity;
        }

        /* Deep Work Toggle */
        .deep-work-toggle {
            position: absolute;
            top: 30px; right: 40px;
            width: 180px; height: 50px;
            background: var(--surface-white);
            border-radius: 25px;
            border: 1px solid var(--border-light);
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
            display: flex;
            align-items: center;
            padding: 5px;
            z-index: 20;
            transform: translateZ(50px);
            opacity: 0;
        }

        .toggle-knob {
            width: 40px; height: 40px;
            background: var(--slate-navy);
            border-radius: 50%;
            transition: all 0.2s ease;
        }

        .toggle-text {
            margin-left: 15px;
            font-weight: 600;
            color: var(--text-dark);
            font-size: 0.9rem;
        }

        /* Notification Badges */
        .badge {
            position: absolute;
            width: 40px; height: 40px;
            background: var(--red-badge);
            color: white;
            font-weight: bold;
            font-size: 1.2rem;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 10px 20px rgba(239, 68, 68, 0.4);
            z-index: 15;
            opacity: 0;
            will-change: transform, opacity;
        }

        .badge-1 { top: 30%; left: 30%; }
        .badge-5 { top: 60%; left: 50%; }
        .badge-12 { top: 40%; left: 70%; }

        /* Zero-Cost Guest Card */
        .guest-card {
            position: absolute;
            top: 250px; left: 100px; /* Sidebar area roughly */
            width: 320px;
            background: white;
            border-radius: 12px;
            border: 1px solid var(--border-light);
            box-shadow: 0 20px 40px rgba(0,0,0,0.15);
            padding: 16px;
            display: flex;
            align-items: center;
            gap: 15px;
            z-index: 25;
            opacity: 0;
            transform: translateZ(100px);
            will-change: transform, opacity;
        }

        .guest-avatar {
            width: 48px; height: 48px;
            background: var(--purple);
            border-radius: 50%;
            color: white;
            display: flex; align-items: center; justify-content: center;
            font-weight: bold; font-size: 1.2rem;
        }

        .guest-info {
            display: flex; flex-direction: column; gap: 4px;
        }

        .guest-name { font-weight: 600; color: var(--text-dark); }
        .guest-fee { font-size: 0.9rem; color: var(--green-accent); font-weight: bold; }

        .ripple-ring {
            position: absolute;
            top: 50%; left: 50%;
            width: 100%; height: 100%;
            transform: translate(-50%, -50%);
            border: 2px solid var(--green-accent);
            border-radius: 12px;
            opacity: 0;
            pointer-events: none;
            z-index: -1;
        }

        /* Huddle Video Player */
        .huddle-player {
            position: absolute;
            top: 50%; left: 50%;
            width: 900px; height: 500px;
            margin-top: -250px; margin-left: -450px;
            background: var(--slate-navy);
            border-radius: 20px;
            border: 1px solid rgba(255,255,255,0.2);
            box-shadow: 0 50px 100px rgba(0,0,0,0.6), 0 0 40px rgba(0, 114, 196, 0.4);
            z-index: 50;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transform: scale(0) translateZ(300px);
            will-change: transform, opacity;
            overflow: hidden;
        }
        
        .huddle-inner {
            width: 100%; height: 100%;
            background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            color: white;
            position: relative;
        }
        
        .huddle-controls {
            position: absolute;
            bottom: 20px;
            display: flex;
            gap: 15px;
        }
        
        .huddle-btn {
            width: 40px; height: 40px;
            background: rgba(255,255,255,0.1);
            border-radius: 50%;
            backdrop-filter: blur(4px);
        }

        .huddle-btn.end { background: var(--red-badge); }

        /* Cursor */
        #virtual-cursor {
            position: absolute;
            width: 32px;
            height: 32px;
            z-index: 999;
            opacity: 0;
            transform: translate(100vw, 100vh);
            will-change: transform, opacity;
            pointer-events: none;
        }

    </style>
</head>
<body>
    <div id="preloader"><div class="spinner"></div></div>
    
    <div id="viewport">
        <div id="ambient-bg"></div>
        
        <div id="world-stage">
            
            <div id="connect-wrapper" class="iframe-wrapper">
                <iframe id="connect-frame" class="iframe-content" src="http://localhost:3000/connect"></iframe>
                
                <!-- Forcefield inside wrapper so it covers the iframe exactly -->
                <div class="forcefield" id="forcefield"></div>
                
                <!-- Guest Card (inserted into wrapper coordinate space) -->
                <div class="guest-card" id="guest-card">
                    <div class="ripple-ring" id="guest-ripple"></div>
                    <div class="guest-avatar">E</div>
                    <div class="guest-info">
                        <span class="guest-name">Emma (External Client)</span>
                        <span class="guest-fee">$0 Seat Fee</span>
                    </div>
                </div>
                
                <!-- Deep Work Toggle inside wrapper -->
                <div class="deep-work-toggle" id="deep-work-toggle">
                    <div class="toggle-knob" id="toggle-knob"></div>
                    <div class="toggle-text">Deep Work</div>
                </div>
            </div>
            
            <!-- Global Overlays -->
            <div class="overlay-layer">
                
                <div class="badge badge-1" id="badge-1">1</div>
                <div class="badge badge-5" id="badge-5">5</div>
                <div class="badge badge-12" id="badge-12">12</div>

                <div class="huddle-player" id="huddle-player">
                    <div class="huddle-inner">
                        <div style="font-size: 48px; margin-bottom: 20px;">🎥</div>
                        <h2>Quick Huddle</h2>
                        <div style="color: var(--green-accent);">● Recording</div>
                        <div class="huddle-controls">
                            <div class="huddle-btn"></div>
                            <div class="huddle-btn"></div>
                            <div class="huddle-btn end"></div>
                        </div>
                    </div>
                </div>
                
            </div>
            
        </div>
        
        <!-- Virtual Cursor -->
        <svg id="virtual-cursor" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M5.5 3.21V20.8c0 .45.54.67.85.35l4.86-4.86a.5.5 0 0 1 .35-.15h6.94c.45 0 .67-.54.35-.85L5.85 2.86a.5.5 0 0 0-.85.35Z" fill="#111827" stroke="#ffffff" stroke-width="2"/>
        </svg>

    </div>

    <script>
    document.addEventListener("DOMContentLoaded", () => {
        gsap.registerPlugin(CustomEase);

        const frame = document.getElementById("connect-frame");
        
        // Iframe Preloader
        const loadPromise = new Promise(resolve => {
            if (frame.contentDocument && frame.contentDocument.readyState === 'complete') {
                resolve();
            } else {
                frame.addEventListener('load', resolve, { once: true });
                frame.addEventListener('error', resolve, { once: true });
            }
        });

        loadPromise.then(() => {
            // 3.5s Hydration Delay
            setTimeout(() => {
                const preloader = document.getElementById('preloader');
                gsap.to(preloader, {
                    opacity: 0,
                    duration: 0.5,
                    onComplete: () => {
                        preloader.style.display = 'none';
                        startAnimation();
                    }
                });
            }, 3500);
        });

        function startAnimation() {
            const tl = gsap.timeline();
            
            // --- BEAT 1: The Connect Sweep (0.0s - 4.0s) ---
            tl.addLabel("connectSweep", 0)
              // Camera sweeps in from deep Z
              .fromTo("#connect-wrapper", 
                  { z: 1500, rotationY: 45, opacity: 0 },
                  { z: 0, rotationY: 0, opacity: 1, duration: 2.5, ease: "expo.out" },
                  "connectSweep"
              )
              // Iframe scrolls down slowly
              .to("#connect-frame", {
                  y: -200,
                  duration: 4.0,
                  ease: "power1.inOut"
              }, "connectSweep");

            // --- BEAT 2: The Deep Work Forcefield (4.0s - 10.0s) ---
            tl.addLabel("forcefieldBeat", 4.0)
              // Toggle appears
              .to("#deep-work-toggle", { opacity: 1, duration: 0.5 }, "forcefieldBeat")
              
              // Cursor moves to toggle
              .to("#virtual-cursor", {
                  x: window.innerWidth/2 + 650, // right side of wrapper roughly
                  y: window.innerHeight/2 - 400,
                  opacity: 1,
                  duration: 1,
                  ease: "power2.out"
              }, "forcefieldBeat")
              
              // Click Toggle ON
              .to("#toggle-knob", {
                  x: 130, // move knob right
                  backgroundColor: "var(--brand-blue)",
                  duration: 0.3,
                  ease: "back.out(2)"
              }, "forcefieldBeat+=1.2")
              .to("#virtual-cursor", { scale: 0.9, duration: 0.1, yoyo: true, repeat: 1 }, "forcefieldBeat+=1.2")
              
              // Forcefield snaps into place
              .fromTo("#forcefield", 
                  { scale: 1.1, opacity: 0 },
                  { scale: 1, opacity: 1, duration: 0.8, ease: "back.out(2)" },
                  "forcefieldBeat+=1.5"
              )
              
              // Red badges fly in from deep Z behind
              .fromTo([".badge-1", ".badge-5", ".badge-12"],
                  { z: -800, opacity: 1, scale: 1 },
                  { z: 0, duration: 0.8, stagger: 0.1, ease: "power2.in" },
                  "forcefieldBeat+=2.0"
              )
              // Badges hit forcefield and scatter/bounce off
              .to(".badge-1", { x: -300, y: -200, scale: 0.5, opacity: 0, duration: 0.6, ease: "power2.out" }, "forcefieldBeat+=2.8")
              .to(".badge-5", { x: 200, y: 300, scale: 0.5, opacity: 0, duration: 0.6, ease: "power2.out" }, "forcefieldBeat+=2.9")
              .to(".badge-12", { x: 400, y: -100, scale: 0.5, opacity: 0, duration: 0.6, ease: "power2.out" }, "forcefieldBeat+=3.0");

            // --- BEAT 3: The Zero-Cost Guest Card (10.0s - 15.0s) ---
            tl.addLabel("guestCard", 10.0)
              // Forcefield dissolves
              .to("#forcefield", { opacity: 0, duration: 1.0 }, "guestCard")
              .to("#deep-work-toggle", { opacity: 0, duration: 0.5 }, "guestCard")
              
              // Guest Card swoops in
              .fromTo("#guest-card",
                  { x: -500, y: -200, rotationZ: -15, opacity: 0 },
                  { x: 0, y: 0, rotationZ: 0, opacity: 1, duration: 1.2, ease: "back.out(1.2)" },
                  "guestCard+=0.5"
              )
              
              // Subtle green ripple
              .fromTo("#guest-ripple",
                  { scale: 1, opacity: 1 },
                  { scale: 1.2, opacity: 0, duration: 1.5, ease: "power2.out" },
                  "guestCard+=1.8"
              );

            // --- BEAT 4: The Huddle Launch (15.0s - 20.0s) ---
            tl.addLabel("huddleLaunch", 15.0)
              // Cursor moves to a "Start Huddle" area (top rightish)
              .to("#virtual-cursor", {
                  x: window.innerWidth/2 + 300,
                  y: window.innerHeight/2 - 350,
                  duration: 1.0,
                  ease: "power2.inOut"
              }, "huddleLaunch")
              // Click
              .to("#virtual-cursor", { scale: 0.9, duration: 0.1, yoyo: true, repeat: 1 }, "huddleLaunch+=1.1")
              
              // Wrapper pushes back and blurs
              .to("#connect-wrapper", {
                  z: -400,
                  filter: "blur(10px)",
                  duration: 1.5,
                  ease: "power2.out"
              }, "huddleLaunch+=1.3")
              .to("#virtual-cursor", { opacity: 0, duration: 0.3 }, "huddleLaunch+=1.3")
              
              // Massive Huddle Video Player aggressively scales up
              .fromTo("#huddle-player",
                  { scale: 0, opacity: 0 },
                  { scale: 1, opacity: 1, duration: 1.2, ease: "expo.out" },
                  "huddleLaunch+=1.5"
              )
              
              // Cinematic float
              .to("#huddle-player", {
                  y: -20,
                  duration: 2.5,
                  yoyo: true,
                  repeat: -1,
                  ease: "sine.inOut"
              }, "huddleLaunch+=2.7");
        }
    });
    </script>
</body>
</html>
