<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weblings Worksuite - Scene 6 (Drive & Recovery)</title>
    <!-- GSAP via CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/CustomEase.min.js"></script>

    <style>
        :root {
            --brand-blue: #0072C4;
            --surface-lighter: #E6F2FF;
            --surface-inverse: #262626;
            --green-accent: #10B981;
            --slate-navy: #0F172A;
            --purple: #9333EA;
            --bg-light: #F4F6F9;
            --surface-white: #ffffff;
            --border-light: #d9d9d9;
            --text-dark: #262626;
            --text-gray: #595959;
            --red-badge: #EF4444;
            --red-bg: #FEF2F2;
        }

        * { box-sizing: border-box; }

        body, html {
            margin: 0;
            padding: 0;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
            background: var(--bg-light) !important;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        .overlay, .mask, body::before, body::after, #world-stage::before, #world-stage::after {
            display: none !important;
        }

        #viewport {
            width: 100vw;
            height: 100vh;
            perspective: 1200px;
            transform-style: preserve-3d;
            position: relative;
            overflow: hidden;
        }

        #ambient-bg {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 150vw;
            height: 150vh;
            transform: translate(-50%, -50%);
            background: radial-gradient(circle at center, var(--surface-lighter) 0%, rgba(0, 114, 196, 0.05) 50%, transparent 100%);
            border-radius: 50%;
            filter: blur(80px);
            z-index: 0;
            pointer-events: none;
        }

        #world-stage {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            transform-style: preserve-3d;
            z-index: 10;
            will-change: transform;
        }

        /* Iframe Preloader */
        #preloader {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: var(--slate-navy);
            z-index: 9999;
            display: flex;
            align-items: center;
            justify-content: center;
            will-change: opacity;
        }

        .spinner {
            width: 60px;
            height: 60px;
            border: 4px solid rgba(255, 255, 255, 0.2);
            border-top: 4px solid #fff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        /* Iframe Styles */
        .iframe-wrapper {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 1440px;
            height: 900px;
            margin-top: -450px;
            margin-left: -720px;
            border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.1);
            box-shadow: 0 40px 100px rgba(0,0,0,0.4);
            overflow: hidden;
            background: var(--surface-white);
            will-change: filter, transform;
            transform-style: preserve-3d;
        }

        .iframe-content {
            width: 1440px;
            height: 2500px;
            border: none;
            pointer-events: none;
            transform-origin: center center;
            will-change: transform;
        }

        .iframe-content::-webkit-scrollbar {
            display: none;
        }

        /* 3D Overlays Layer */
        .overlay-layer {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            transform-style: preserve-3d;
        }

        /* Virtual Cursor */
        #virtual-cursor {
            position: absolute;
            width: 32px;
            height: 32px;
            z-index: 999;
            opacity: 0;
            transform: translate(100vw, 100vh);
            will-change: transform, opacity;
            pointer-events: none;
        }

        /* Beat 1: Smart Sync Folder */
        .sync-folder {
            position: absolute;
            top: 50%; left: 50%;
            width: 400px;
            height: 250px;
            margin-top: -125px;
            margin-left: -200px;
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.5);
            border-radius: 20px;
            box-shadow: 0 30px 60px rgba(0,0,0,0.15);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 20;
            opacity: 0;
            transform: scale(0) translateZ(200px);
            will-change: transform, opacity;
        }

        .folder-icon {
            font-size: 80px;
            margin-bottom: 10px;
            color: var(--brand-blue);
        }

        .folder-title {
            font-size: 1.4rem;
            font-weight: 700;
            color: var(--text-dark);
            text-align: center;
        }

        .folder-size {
            font-size: 1.1rem;
            color: var(--text-gray);
            margin-top: 5px;
        }

        .sync-badge {
            position: absolute;
            bottom: -20px;
            right: -30px;
            background: var(--surface-white);
            color: var(--text-dark);
            border: 2px solid var(--green-accent);
            padding: 10px 20px;
            border-radius: 30px;
            font-weight: bold;
            font-size: 1rem;
            box-shadow: 0 10px 30px rgba(16, 185, 129, 0.4);
            display: flex;
            align-items: center;
            gap: 10px;
            z-index: 25;
            opacity: 0;
            transform: scale(0);
            will-change: transform, opacity, box-shadow;
        }

        .sync-cloud-icon { color: var(--green-accent); font-size: 1.2rem; }

        /* Beat 2: File Icon */
        .file-icon-container {
            position: absolute;
            top: 50%; left: 50%;
            width: 300px;
            height: 300px;
            margin-top: -150px;
            margin-left: -150px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 30;
            opacity: 0;
            transform: scale(0) translateZ(100px);
            will-change: transform, opacity;
        }

        .psd-icon {
            width: 140px;
            height: 180px;
            background: #31A8FF; /* Default PSD Blueish */
            border-radius: 16px;
            border: 2px solid #0054A6;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 800;
            font-size: 2rem;
            box-shadow: 0 20px 40px rgba(0,0,0,0.2);
            position: relative;
            will-change: background, border-color, box-shadow;
            transition: background 0.2s, border-color 0.2s, box-shadow 0.2s;
        }

        .psd-icon::before {
            content: '';
            position: absolute;
            top: -2px; right: -2px;
            border-width: 0 40px 40px 0;
            border-style: solid;
            border-color: #0054A6 #F4F6F9 #31A8FF #31A8FF;
            border-radius: 0 16px 0 0;
        }

        .file-name {
            margin-top: 20px;
            font-size: 1.2rem;
            font-weight: bold;
            color: var(--text-dark);
            background: rgba(255,255,255,0.8);
            padding: 8px 16px;
            border-radius: 8px;
            text-align: center;
            will-change: color;
            transition: color 0.2s;
        }

        /* Corrupted State Styles */
        .psd-icon.corrupt {
            background: var(--red-badge);
            border-color: #7F1D1D;
            box-shadow: 0 0 30px rgba(239, 68, 68, 0.6);
        }
        .psd-icon.corrupt::before {
            border-color: #7F1D1D #F4F6F9 var(--red-badge) var(--red-badge);
        }
        .file-name.corrupt {
            color: var(--red-badge);
        }

        /* Beat 3: Version History Side-Panel */
        .version-panel {
            position: absolute;
            top: 50%; right: 0;
            width: 450px;
            height: 900px;
            margin-top: -450px;
            background: var(--slate-navy);
            border-left: 1px solid rgba(255,255,255,0.1);
            box-shadow: -30px 0 60px rgba(0,0,0,0.5);
            padding: 40px;
            color: white;
            z-index: 50;
            transform: translateX(500px) translateZ(100px);
            will-change: transform;
            display: flex;
            flex-direction: column;
        }

        .panel-title {
            font-size: 1.8rem;
            font-weight: 800;
            margin-bottom: 30px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            padding-bottom: 15px;
        }

        .version-item {
            padding: 20px;
            border-radius: 12px;
            background: rgba(255,255,255,0.05);
            margin-bottom: 15px;
            border: 1px solid rgba(255,255,255,0.05);
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .v-item-red { border-color: rgba(239, 68, 68, 0.4); background: rgba(239, 68, 68, 0.05); }

        .v-time { font-weight: bold; font-size: 1.1rem; }
        .v-time-red { color: var(--red-badge); }
        .v-time-green { color: var(--green-accent); }

        .v-author { font-size: 0.9rem; color: #94A3B8; }

        .rollback-btn {
            background: var(--green-accent);
            color: white;
            padding: 10px 20px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 1rem;
            align-self: flex-start;
            margin-top: 5px;
            box-shadow: 0 5px 15px rgba(16, 185, 129, 0.3);
        }

        /* Restoration Pulse */
        .restoration-pulse {
            position: absolute;
            top: 50%; left: 50%;
            width: 100px; height: 100px;
            margin-top: -50px; margin-left: -50px;
            border-radius: 50%;
            background: var(--green-accent);
            opacity: 0;
            z-index: 25;
            pointer-events: none;
            transform: scale(0);
            will-change: transform, opacity;
        }

        /* Success Badge */
        .success-badge {
            position: absolute;
            top: 250px; left: 50%;
            margin-left: -120px;
            width: 240px;
            background: var(--green-accent);
            color: white;
            padding: 12px 20px;
            border-radius: 30px;
            font-weight: bold;
            font-size: 1.1rem;
            text-align: center;
            box-shadow: 0 10px 30px rgba(16, 185, 129, 0.5);
            z-index: 60;
            opacity: 0;
            transform: scale(0) translateZ(150px);
            will-change: transform, opacity;
        }

    </style>
</head>
<body>
    <div id="preloader"><div class="spinner"></div></div>

    <div id="viewport">
        <div id="ambient-bg"></div>

        <div id="world-stage">

            <div id="drive-wrapper" class="iframe-wrapper">
                <iframe id="drive-frame" class="iframe-content" src="http://localhost:3000/drive"></iframe>
            </div>

            <div class="overlay-layer">

                <!-- Smart Sync Folder -->
                <div class="sync-folder" id="sync-folder">
                    <div class="folder-icon">📁</div>
                    <div class="folder-title">Enterprise Media Assets</div>
                    <div class="folder-size">52.4 GB</div>

                    <div class="sync-badge" id="sync-badge">
                        <span class="sync-cloud-icon">☁️</span> Local Disk Space Used: 0 Bytes
                    </div>
                </div>

                <!-- PSD File Icon -->
                <div class="file-icon-container" id="file-container">
                    <div class="psd-icon" id="psd-icon">PSD</div>
                    <div class="file-name" id="file-name">Final_Client_Master.psd</div>
                </div>

                <!-- Version History Side-Panel -->
                <div class="version-panel" id="version-panel">
                    <div class="panel-title">Infinite Version History</div>

                    <div class="version-item v-item-red">
                        <div class="v-time v-time-red">Just Now</div>
                        <div class="v-author">Modified by: External Script</div>
                    </div>

                    <div class="version-item">
                        <div class="v-time v-time-green">2 hours ago</div>
                        <div class="v-author">Saved by: Alex Turner</div>
                        <div class="rollback-btn" id="rollback-btn">Rollback</div>
                    </div>

                    <div class="version-item">
                        <div class="v-time">Yesterday at 4:00 PM</div>
                        <div class="v-author">Saved by: Emma (Client)</div>
                    </div>
                </div>

                <!-- Restoration Pulse -->
                <div class="restoration-pulse" id="restoration-pulse"></div>

                <!-- Success Badge -->
                <div class="success-badge" id="success-badge">Restored Successfully</div>

            </div>

        </div>

        <!-- Virtual Cursor -->
        <svg id="virtual-cursor" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M5.5 3.21V20.8c0 .45.54.67.85.35l4.86-4.86a.5.5 0 0 1 .35-.15h6.94c.45 0 .67-.54.35-.85L5.85 2.86a.5.5 0 0 0-.85.35Z" fill="#111827" stroke="#ffffff" stroke-width="2"/>
        </svg>

    </div>

    <script>
    document.addEventListener("DOMContentLoaded", () => {
        gsap.registerPlugin(CustomEase);

        const frame = document.getElementById("drive-frame");

        // Iframe Preloader
        const loadPromise = new Promise(resolve => {
            if (frame.contentDocument && frame.contentDocument.readyState === 'complete') {
                resolve();
            } else {
                frame.addEventListener('load', resolve, { once: true });
                frame.addEventListener('error', resolve, { once: true });
            }
        });

        loadPromise.then(() => {
            // 3.5s Hydration Delay
            setTimeout(() => {
                const preloader = document.getElementById('preloader');
                gsap.to(preloader, {
                    opacity: 0,
                    duration: 0.5,
                    onComplete: () => {
                        preloader.style.display = 'none';
                        startAnimation();
                    }
                });
            }, 3500);
        });

        function startAnimation() {
            const tl = gsap.timeline();

            // --- BEAT 1: Desktop Smart Sync (0.0s - 6.0s) ---
            tl.addLabel("smartSync", 0)
              // Camera sweeps in dynamically
              .fromTo("#world-stage",
                  { z: -500, rotationX: 10, rotationY: -10, opacity: 0 },
                  { z: 0, rotationX: 0, rotationY: 0, opacity: 1, duration: 2.5, ease: "power2.out" },
                  "smartSync"
              )

              // Heavy folder scales up
              .fromTo("#sync-folder",
                  { scale: 0, opacity: 0 },
                  { scale: 1, opacity: 1, duration: 1.5, ease: "back.out(1.5)" },
                  "smartSync+=1.0"
              )

              // 0 Bytes badge snaps on
              .fromTo("#sync-badge",
                  { scale: 0, opacity: 0 },
                  { scale: 1, opacity: 1, duration: 0.8, ease: "back.out(2)" },
                  "smartSync+=2.0"
              )

              // Badge pulses green glow
              .to("#sync-badge", {
                  boxShadow: "0 0 30px rgba(16, 185, 129, 0.8)",
                  duration: 1.0,
                  yoyo: true,
                  repeat: 2,
                  ease: "sine.inOut"
              }, "smartSync+=2.5");

            // --- BEAT 2: The Accidental Overwrite (6.0s - 10.0s) ---
            tl.addLabel("overwrite", 6.0)
              // Folder fades out
              .to("#sync-folder", { scale: 0.8, opacity: 0, duration: 0.8, ease: "power2.in" }, "overwrite")

              // Camera zooms slightly in
              .to("#world-stage", { scale: 1.05, duration: 2.0, ease: "power2.inOut" }, "overwrite+=0.5")

              // PSD file pops up
              .fromTo("#file-container",
                  { scale: 0, opacity: 0 },
                  { scale: 1, opacity: 1, duration: 1.0, ease: "back.out(1.5)" },
                  "overwrite+=1.0"
              )

              // File visually corrupts (turns red, text changes)
              .call(() => {
                  document.getElementById("psd-icon").classList.add("corrupt");
                  document.getElementById("file-name").classList.add("corrupt");
                  document.getElementById("file-name").innerText = "Final_Client_Master_v2_OVERWRITTEN.psd";
              }, null, "overwrite+=2.5")

              // Camera shakes
              .to("#world-stage", {
                  x: 10, y: -10, rotationZ: 1, duration: 0.05, yoyo: true, repeat: 5, ease: "none"
              }, "overwrite+=2.5")
              .to("#world-stage", { x: 0, y: 0, rotationZ: 0, duration: 0.1 }, "overwrite+=2.8");

            // --- BEAT 3: Infinite Version History (10.0s - 15.0s) ---
            tl.addLabel("versionHistory", 10.0)
              // Cursor swoops in
              .to("#virtual-cursor", {
                  x: window.innerWidth/2, // center of screen where file is
                  y: window.innerHeight/2,
                  opacity: 1,
                  duration: 1.5,
                  ease: "power2.out"
              }, "versionHistory")

              // Click file
              .to("#virtual-cursor", { scale: 0.9, duration: 0.1, yoyo: true, repeat: 1 }, "versionHistory+=1.6")
              .to("#file-container", { scale: 0.95, duration: 0.1, yoyo: true, repeat: 1 }, "versionHistory+=1.6")

              // Move file to the left to make room
              .to("#file-container", {
                  x: -200,
                  duration: 1.0,
                  ease: "power2.inOut"
              }, "versionHistory+=1.8")

              // Version panel violently slides in
              .to("#version-panel", {
                  x: 0,
                  duration: 1.2,
                  ease: "expo.out"
              }, "versionHistory+=1.8")

              // Cast shadow over drive interface via iframe brightness
              .to("#drive-wrapper", { filter: "brightness(0.5)", duration: 1.0 }, "versionHistory+=1.8");

            // --- BEAT 4: Point-in-Time Rollback (15.0s - 20.0s) ---
            tl.addLabel("rollback", 15.0)
              // Cursor moves to Rollback button
              // Panel is 450px wide on right side. Rollback is roughly middle.
              .to("#virtual-cursor", {
                  x: window.innerWidth - 300,
                  y: window.innerHeight/2 + 20,
                  duration: 1.0,
                  ease: "power2.inOut"
              }, "rollback")

              // Click Rollback
              .to("#virtual-cursor", { scale: 0.9, duration: 0.1, yoyo: true, repeat: 1 }, "rollback+=1.1")
              .to("#rollback-btn", { scale: 0.95, duration: 0.1, yoyo: true, repeat: 1 }, "rollback+=1.1")

              // Position pulse over the file container which is shifted x: -200
              .set("#restoration-pulse", { x: -200 }, "rollback+=1.2")

              // Sweeping glowing green pulse
              .to("#restoration-pulse", {
                  scale: 15,
                  opacity: 0.5,
                  duration: 0.8,
                  ease: "power2.out"
              }, "rollback+=1.2")

              // Reverse corruption
              .call(() => {
                  document.getElementById("psd-icon").classList.remove("corrupt");
                  document.getElementById("file-name").classList.remove("corrupt");
                  document.getElementById("file-name").innerText = "Final_Client_Master.psd";
              }, null, "rollback+=1.5")

              // Pulse fade out
              .to("#restoration-pulse", { opacity: 0, duration: 0.3 }, "rollback+=1.8")

              // File snaps back pristine
              .to("#file-container", {
                  scale: 1.1, // Elastic pop
                  duration: 0.8,
                  ease: "elastic.out(1, 0.4)"
              }, "rollback+=1.5")

              // Panel slides away
              .to("#version-panel", { x: 500, duration: 1.0, ease: "power2.in" }, "rollback+=2.5")
              .to("#drive-wrapper", { filter: "brightness(1)", duration: 1.0 }, "rollback+=2.5")
              .to("#virtual-cursor", { opacity: 0, duration: 0.5 }, "rollback+=2.5")

              // File centers back
              .to("#file-container", { x: 0, scale: 1, duration: 1.0, ease: "power2.out" }, "rollback+=2.5")

              // Restored badge pops
              .to("#success-badge", {
                  scale: 1,
                  opacity: 1,
                  duration: 0.8,
                  ease: "back.out(1.5)"
              }, "rollback+=3.5")

              // Gentle 3D float
              .to("#world-stage", {
                  y: -15,
                  duration: 3,
                  yoyo: true,
                  repeat: -1,
                  ease: "sine.inOut"
              }, "rollback+=4.0");
        }
    });
    </script>
</body>
</html>
