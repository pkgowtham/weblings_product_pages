<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scene 1: Domain Claim & 5-Min IT Bypass</title>
  <style>
    /* Reset and Base Constraints */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100vw;
      height: 100vh;
      overflow: hidden; /* Critical Anti-Deformation Constraint */
      background-color: #F4F6F9;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: #0F172A;
    }

    /* Master Timeline Controller Canvas */
    #canvas-container {
      width: 100vw;
      height: 100vh;
      position: relative;
      perspective: 1400px; /* Camera Rig */
      transform-style: preserve-3d;
    }

    /* The World Stage - larger than viewport to prevent empty background edge during pan/zoom */
    #world-stage {
      position: absolute;
      top: -50vh;
      left: -50vw;
      width: 300vw;
      height: 200vh;
      transform-style: preserve-3d;
      transform-origin: 50% 50%;
      will-change: transform, filter;
    }

    /* Virtual Cursor */
    #cursor {
      position: fixed;
      top: 0;
      left: 0;
      width: 32px;
      height: 32px;
      pointer-events: none;
      z-index: 9999;
      transform: translate(-50%, -50%);
    }

    /* Design Tokens */
    :root {
      --brand-blue: #0072C4;
      --surface-lighter: #E6F2FF;
      --slate-navy: #0F172A;
      --bg-light: #F4F6F9;
      --green-accent: #10B981;
      --white: #ffffff;
      --gray-border: #d9d9d9;
    }

    /* Layout Positioning of Sections */
    .section-wrapper {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
    }

    /* Modals Container (attached to viewport so they are overlay) */
    #modals-container {
      position: fixed;
      top: 0; left: 0;
      width: 100vw; height: 100vh;
      pointer-events: none;
      z-index: 100;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .modal {
      background: var(--white);
      border-radius: 12px;
      padding: 32px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.1);
      opacity: 0;
      transform: scale(0.9);
      display: none;
    }

    /* Modals */
    #confetti-modal {
      text-align: center;
      max-width: 400px;
    }

    #confetti-modal h3 {
      font-size: 24px;
      color: var(--brand-blue);
      margin-bottom: 12px;
    }

    #confetti-modal p {
      font-size: 16px;
      color: #595959;
    }

    #bypass-modal {
      width: 480px;
    }

    #bypass-modal h3 {
      font-size: 24px;
      margin-bottom: 24px;
      border-bottom: 1px solid var(--gray-border);
      padding-bottom: 12px;
    }

    .checklist-item {
      display: flex;
      align-items: center;
      margin-bottom: 16px;
      font-size: 16px;
      color: #595959;
    }

    .check-icon {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      border: 2px solid var(--gray-border);
      margin-right: 16px;
      display: flex;
      justify-content: center;
      align-items: center;
      transition: all 0.3s ease;
    }

    .check-icon svg {
      width: 14px;
      height: 14px;
      fill: none;
      stroke: white;
      stroke-width: 3;
      stroke-linecap: round;
      stroke-linejoin: round;
      opacity: 0;
    }

    .checklist-item.resolved .check-icon {
      background: var(--green-accent);
      border-color: var(--green-accent);
    }
    .checklist-item.resolved .check-icon svg {
      opacity: 1;
    }
    .checklist-item.resolved .item-text {
      color: var(--slate-navy);
      font-weight: 500;
    }

    /* Iframe constraints per directive */
    .ui-screen {
      width: 1440px;
      height: 900px;
      border: none;
      pointer-events: none;
      transform-origin: center center;
    }

    /* Scroll simulation constraints */
    .scroll-wrapper {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 1440px;
      height: 900px;
      overflow: hidden;
      transform: translate(-50%, -50%);
      transform-style: preserve-3d;
      border-radius: 16px;
      box-shadow: 0 40px 80px rgba(0,0,0,0.5);
    }

    .scroll-wrapper iframe {
      height: 2000px; /* Taller for scroll simulation */
    }

    #domain-section {
      left: 100vw;
      top: 100vh;
    }

    /* Secondary iframes for cascade */
    #eoffice-section {
      position: absolute;
      top: 100vh;
      left: 200vw;
      width: 1440px;
      height: 900px;
      transform: translate(-50%, -50%) rotateY(-15deg);
      transform-style: preserve-3d;
    }

    .cascade-iframe {
      position: absolute;
      top: 0;
      left: 0;
      border-radius: 16px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.3);
      opacity: 0;
      transform: translateY(40px) translateZ(-100px) rotateX(-20deg);
      transform-origin: center top;
      transform-style: preserve-3d;
    }

    /* Hide scrollbars */
    ::-webkit-scrollbar {
      display: none;
    }
  </style>
</head>
<body>

  <!-- Virtual Cursor -->
  <svg id="cursor" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
    <path d="M5.5 3L18.5 11L12.5 13L9.5 21L5.5 3Z" fill="white" stroke="#0F172A" stroke-width="1.5" stroke-linejoin="round"/>
  </svg>

  <div id="canvas-container">
    <div id="world-stage">

      <!-- Base Main Screen (Scroll wrapper simulating the Claim section) -->
      <div class="scroll-wrapper section-wrapper" id="domain-section">
        <iframe src="http://localhost:3000/" class="ui-screen" id="scrolling-iframe"></iframe>
      </div>

      <!-- Cascading Screens replacing E-Office Section -->
      <div id="eoffice-section" class="section-wrapper">
        <iframe src="http://localhost:3000/eoffice" class="ui-screen cascade-iframe cascade-item" id="cascade-1" style="z-index: 1;"></iframe>
        <iframe src="http://localhost:3000/connect" class="ui-screen cascade-iframe cascade-item" id="cascade-2" style="z-index: 2;"></iframe>
        <iframe src="http://localhost:3000/calendar" class="ui-screen cascade-iframe cascade-item" id="cascade-3" style="z-index: 3;"></iframe>
      </div>

    </div>
  </div>

  <!-- Modals Layer -->
  <div id="modals-container">
    <!-- Confetti Modal -->
    <div id="confetti-modal" class="modal">
      <div style="font-size: 48px; margin-bottom: 16px;">🎉</div>
      <h3>Domain Secured in 24 hrs</h3>
      <p>Zero Lock-in Guarantee</p>
    </div>

    <!-- 5-Minute IT Bypass Modal -->
    <div id="bypass-modal" class="modal">
      <h3>The 5-Minute IT Bypass</h3>

      <div class="checklist-item" id="chk-email">
        <div class="check-icon"><svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"></polyline></svg></div>
        <div class="item-text">Auto-generates alex@acme.io</div>
      </div>

      <div class="checklist-item" id="chk-chat">
        <div class="check-icon"><svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"></polyline></svg></div>
        <div class="item-text">Provisions chat</div>
      </div>

      <div class="checklist-item" id="chk-boards">
        <div class="check-icon"><svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"></polyline></svg></div>
        <div class="item-text">Agile boards</div>
      </div>

      <div class="checklist-item" id="chk-calendar">
        <div class="check-icon"><svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"></polyline></svg></div>
        <div class="item-text">Calendar</div>
      </div>

    </div>
  </div>

  <!-- GSAP CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>

  <script>
    // Initialize GSAP and plugins
    const worldStage = document.getElementById('world-stage');
    const cursor = document.getElementById('cursor');
    const confettiModal = document.getElementById('confetti-modal');
    const bypassModal = document.getElementById('bypass-modal');
    const scrollingIframe = document.getElementById('scrolling-iframe');
    const cascadeItems = document.querySelectorAll('.cascade-item');

    // Make sure modals have display block but opacity 0 initially so GSAP can animate them
    gsap.set([confettiModal, bypassModal], { display: 'block', autoAlpha: 0, scale: 0.9 });

    // Initial Cursor Position
    gsap.set(cursor, { x: window.innerWidth * 0.8, y: window.innerHeight * 0.8 });

    // Master Timeline
    const masterTl = gsap.timeline({
      paused: false // Set to false to auto-play
    });

    // --- [0:00 - 0:02] The Claim (Compressed) & Simulated Scroll ---
    masterTl.addLabel("start")
      // Animate the iframe's translateY to simulate smooth scrolling
      .to(scrollingIframe, {
        duration: 4,
        y: -1000,
        ease: "power2.inOut"
      }, "start")
      // Move cursor simultaneously while camera is zooming/panning slightly
      .to(cursor, {
        duration: 1,
        x: window.innerWidth / 2,
        y: window.innerHeight / 2,
        ease: "power3.inOut"
      }, "start")
      // Simulate click
      .to(cursor, {
        duration: 0.1,
        scale: 0.8,
        ease: "power1.inOut"
      }, "start+=1.5")
      .to(cursor, {
        duration: 0.3,
        scale: 1,
        ease: "back.out(1.7)"
      }, "start+=1.6");

    // --- [0:02 - 0:04] The Success ---
    masterTl.addLabel("success", "start+=1.7")
      // Pop up Confetti modal (springy) & Zoom in overlapping
      .to(confettiModal, {
        duration: 0.6,
        autoAlpha: 1,
        scale: 1,
        ease: "back.out(1.7)"
      }, "success")
      .to(worldStage, {
        duration: 0.8,
        scale: 1.1,
        filter: "blur(4px)",
        ease: "expo.out"
      }, "success");

    // --- [0:04 - 0:07] The 3D Transition & Cascade ---
    masterTl.addLabel("transition", "success+=1.5")
      // Close Confetti modal
      .to(confettiModal, {
        duration: 0.3,
        autoAlpha: 0,
        scale: 0.8,
        ease: "power2.in"
      }, "transition")
      // Reveal E-Office section container instantly
      .set("#eoffice-section", { opacity: 1 }, "transition")
      // Pan and tilt camera sharply
      .to(worldStage, {
        duration: 1.2,
        x: "-100vw", // Pan left (moving world left moves camera right)
        rotateY: 15,  // Straighten out the E-office which is rotated -15deg
        scale: 0.8,     // Reset zoom slightly out
        filter: "blur(0px)", // Remove blur
        ease: "expo.out"
      }, "transition")
      // Cursor anticipates target and starts moving during the pan
      .to(cursor, {
        duration: 1.5,
        x: window.innerWidth * 0.65, // Approximating button pos on the new section
        y: window.innerHeight * 0.45,
        ease: "power3.inOut"
      }, "transition+=0.2")
      // 3D Cascading Reveal of Iframes (overlapping the pan)
      .to(cascadeItems, {
        duration: 1.2,
        autoAlpha: 1,
        y: 0,
        z: (i) => i * 150 + 100, // Stagger in 3D depth
        rotateX: 0,
        stagger: 0.05,
        ease: "back.out(1.7)"
      }, "transition+=0.3");

    // --- [0:07 - 0:10] The Bypass Trigger ---
    masterTl.addLabel("bypass", "transition+=1.5")
      // Final precision cursor adjustment to a fake target on the iframe
      .to(cursor, {
        duration: 0.4,
        x: window.innerWidth * 0.7,
        y: window.innerHeight * 0.3,
        ease: "power2.out"
      }, "bypass")
      // Click action
      .to(cursor, {
        duration: 0.1,
        scale: 0.8,
        ease: "power1.inOut"
      }, "bypass+=0.4")
      .to(cursor, {
        duration: 0.3,
        scale: 1,
        ease: "back.out(1.7)"
      }, "bypass+=0.5")
      // Show Bypass Modal & Zoom overlapping
      .to(bypassModal, {
        duration: 0.5,
        autoAlpha: 1,
        scale: 1,
        ease: "back.out(1.7)"
      }, "bypass+=0.5")
      .to(worldStage, {
        duration: 1,
        scale: 1.15,
        filter: "blur(6px)",
        ease: "expo.out"
      }, "bypass+=0.5");

    // --- [0:10 - 0:13] The Rapid Resolution ---
    masterTl.addLabel("resolution", "bypass+=1.2")
      // Rapid-fire resolve checklist items
      .to("#chk-email", { duration: 0.1, onStart: () => document.getElementById('chk-email').classList.add('resolved') }, "resolution")
      .to("#chk-chat", { duration: 0.1, onStart: () => document.getElementById('chk-chat').classList.add('resolved') }, "resolution+=0.15")
      .to("#chk-boards", { duration: 0.1, onStart: () => document.getElementById('chk-boards').classList.add('resolved') }, "resolution+=0.3")
      .to("#chk-calendar", { duration: 0.1, onStart: () => document.getElementById('chk-calendar').classList.add('resolved') }, "resolution+=0.45")
      // Close modal (snappy)
      .to(bypassModal, {
        duration: 0.3,
        autoAlpha: 0,
        scale: 0.8,
        ease: "back.in(1.5)"
      }, "resolution+=0.8")
      // Unzoom sharply
      .to(worldStage, {
        duration: 0.8,
        scale: 0.8,
        filter: "blur(0px)",
        ease: "expo.out"
      }, "resolution+=0.8");

  </script>
</body>
</html>
