<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scene 1: Cinematic Product Trailer</title>
  <style>
    /* Reset and Base Constraints */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100vw;
      height: 100vh;
      overflow: hidden; /* Critical Anti-Deformation Constraint */
      background-color: #0F172A; /* Slate Navy */
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: #0F172A;
    }

    /* Ambient Lighting Background */
    #ambient-bg {
      position: fixed;
      top: -50%;
      left: -50%;
      width: 200vw;
      height: 200vh;
      background: radial-gradient(circle at center, rgba(0, 114, 196, 0.4) 0%, rgba(147, 51, 234, 0.2) 40%, rgba(15, 23, 42, 1) 70%);
      z-index: 1;
      animation: pulseRotate 20s infinite alternate linear;
    }

    @keyframes pulseRotate {
      0% { transform: scale(1) rotate(0deg); }
      100% { transform: scale(1.2) rotate(15deg); }
    }

    /* Preloader */
    #loader {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background-color: #0F172A;
      z-index: 99999;
      display: flex;
      justify-content: center;
      align-items: center;
      transition: opacity 0.8s ease;
    }

    .spinner {
      width: 50px;
      height: 50px;
      border: 3px solid rgba(255, 255, 255, 0.1);
      border-radius: 50%;
      border-top-color: #ffffff;
      animation: spin 1s ease-in-out infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* Master Timeline Controller Canvas */
    #canvas-container {
      width: 100vw;
      height: 100vh;
      position: relative;
      perspective: 1400px; /* Camera Rig */
      transform-style: preserve-3d;
      z-index: 2;
    }

    /* The World Stage */
    #world-stage {
      position: absolute;
      top: -50vh;
      left: -50vw;
      width: 300vw;
      height: 200vh;
      transform-style: preserve-3d;
      transform-origin: 50% 50%;
      will-change: transform, filter;
    }

    /* Virtual Cursor */
    #cursor {
      position: fixed;
      top: 0;
      left: 0;
      width: 32px;
      height: 32px;
      pointer-events: none;
      z-index: 9999;
      transform: translate(-50%, -50%);
    }

    /* Design Tokens */
    :root {
      --brand-blue: #0072C4;
      --surface-lighter: #E6F2FF;
      --slate-navy: #0F172A;
      --bg-light: #F4F6F9;
      --green-accent: #10B981;
      --white: #ffffff;
      --gray-border: #d9d9d9;
    }

    /* Modals Container */
    #modals-container {
      position: fixed;
      top: 0; left: 0;
      width: 100vw; height: 100vh;
      pointer-events: none;
      z-index: 100;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .modal {
      background: var(--white);
      border-radius: 12px;
      padding: 32px;
      box-shadow: 0 40px 100px rgba(0,0,0,0.4);
      opacity: 0;
      transform: scale(0.9);
      display: none;
      border: 1px solid rgba(255,255,255,0.1);
    }

    /* Modals */
    #confetti-modal {
      text-align: center;
      max-width: 400px;
    }

    #confetti-modal h3 {
      font-size: 24px;
      color: var(--brand-blue);
      margin-bottom: 12px;
    }

    #confetti-modal p {
      font-size: 16px;
      color: #595959;
    }

    #bypass-modal {
      width: 480px;
    }

    #bypass-modal h3 {
      font-size: 24px;
      margin-bottom: 24px;
      border-bottom: 1px solid var(--gray-border);
      padding-bottom: 12px;
    }

    .checklist-item {
      display: flex;
      align-items: center;
      margin-bottom: 16px;
      font-size: 16px;
      color: #595959;
    }

    .check-icon {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      border: 2px solid var(--gray-border);
      margin-right: 16px;
      display: flex;
      justify-content: center;
      align-items: center;
      transition: all 0.3s ease;
    }

    .check-icon svg {
      width: 14px;
      height: 14px;
      fill: none;
      stroke: white;
      stroke-width: 3;
      stroke-linecap: round;
      stroke-linejoin: round;
      opacity: 0;
    }

    .checklist-item.resolved .check-icon {
      background: var(--green-accent);
      border-color: var(--green-accent);
    }
    .checklist-item.resolved .check-icon svg {
      opacity: 1;
    }
    .checklist-item.resolved .item-text {
      color: var(--slate-navy);
      font-weight: 500;
    }

    /* Iframe & Cinematic Wrappers constraints per directive */
    .cinematic-wrapper {
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,0.1);
      box-shadow: 0 40px 100px rgba(0,0,0,0.4);
      background-color: var(--white);
      overflow: hidden;
      transform-style: preserve-3d;
      will-change: transform, filter, opacity;
    }

    .ui-screen {
      width: 1440px;
      height: 900px;
      border: none;
      pointer-events: none;
      transform-origin: center center;
    }

    /* Scroll simulation constraints */
    #domain-wrapper {
      position: absolute;
      top: 100vh;
      left: 100vw;
      width: 1440px;
      height: 900px;
      transform: translate(-50%, -50%);
    }

    #domain-wrapper iframe {
      height: 2000px; /* Taller for scroll simulation */
    }

    /* Secondary iframes for cascade */
    #eoffice-wrapper {
      position: absolute;
      top: 100vh;
      left: 200vw;
      width: 1440px;
      height: 900px;
      transform: translate(-50%, -50%) rotateY(-15deg);
      transform-style: preserve-3d;
      /* Remove cinematic wrapper properties from the container itself, apply to children */
      border: none;
      box-shadow: none;
      background: transparent;
      overflow: visible;
    }

    .cascade-item {
      position: absolute;
      top: 0;
      left: 0;
      opacity: 0;
      transform: translateY(40px) translateZ(-100px) rotateX(-20deg);
      transform-origin: center top;
      /* These are the individual windows, they get the cinematic polish */
    }

    /* Hide scrollbars */
    ::-webkit-scrollbar {
      display: none;
    }
  </style>
</head>
<body>

  <!-- Preloader -->
  <div id="loader">
    <div class="spinner"></div>
  </div>

  <!-- Ambient Light -->
  <div id="ambient-bg"></div>

  <!-- Virtual Cursor -->
  <svg id="cursor" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
    <path d="M5.5 3L18.5 11L12.5 13L9.5 21L5.5 3Z" fill="white" stroke="#0F172A" stroke-width="1.5" stroke-linejoin="round"/>
  </svg>

  <div id="canvas-container">
    <div id="world-stage">

      <!-- Base Main Screen (Scroll wrapper simulating the Claim section) -->
      <div class="cinematic-wrapper" id="domain-wrapper">
        <iframe src="/YOUR_ROUTE_HERE" class="ui-screen" id="scrolling-iframe"></iframe>
      </div>

      <!-- Cascading Screens replacing E-Office Section -->
      <div id="eoffice-wrapper">
        <div class="cinematic-wrapper cascade-item" id="cascade-1" style="z-index: 1;">
          <iframe src="/YOUR_ROUTE_HERE" class="ui-screen"></iframe>
        </div>
        <div class="cinematic-wrapper cascade-item" id="cascade-2" style="z-index: 2;">
          <iframe src="/YOUR_ROUTE_HERE" class="ui-screen"></iframe>
        </div>
        <div class="cinematic-wrapper cascade-item" id="cascade-3" style="z-index: 3;">
          <iframe src="/YOUR_ROUTE_HERE" class="ui-screen"></iframe>
        </div>
      </div>

    </div>
  </div>

  <!-- Modals Layer -->
  <div id="modals-container">
    <!-- Confetti Modal -->
    <div id="confetti-modal" class="modal">
      <div style="font-size: 48px; margin-bottom: 16px;">🎉</div>
      <h3>Domain Secured in 24 hrs</h3>
      <p>Zero Lock-in Guarantee</p>
    </div>

    <!-- 5-Minute IT Bypass Modal -->
    <div id="bypass-modal" class="modal">
      <h3>The 5-Minute IT Bypass</h3>

      <div class="checklist-item" id="chk-email">
        <div class="check-icon"><svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"></polyline></svg></div>
        <div class="item-text">Auto-generates alex@acme.io</div>
      </div>

      <div class="checklist-item" id="chk-chat">
        <div class="check-icon"><svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"></polyline></svg></div>
        <div class="item-text">Provisions chat</div>
      </div>

      <div class="checklist-item" id="chk-boards">
        <div class="check-icon"><svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"></polyline></svg></div>
        <div class="item-text">Agile boards</div>
      </div>

      <div class="checklist-item" id="chk-calendar">
        <div class="check-icon"><svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"></polyline></svg></div>
        <div class="item-text">Calendar</div>
      </div>

    </div>
  </div>

  <!-- GSAP CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>

  <script>
    // Initialize GSAP Elements
    const worldStage = document.getElementById('world-stage');
    const cursor = document.getElementById('cursor');
    const confettiModal = document.getElementById('confetti-modal');
    const bypassModal = document.getElementById('bypass-modal');
    const scrollingIframe = document.getElementById('scrolling-iframe');
    const cascadeItems = document.querySelectorAll('.cascade-item');
    const domainWrapper = document.getElementById('domain-wrapper');
    const loader = document.getElementById('loader');

    // Make sure modals have display block but opacity 0 initially so GSAP can animate them
    gsap.set([confettiModal, bypassModal], { display: 'block', autoAlpha: 0, scale: 0.9 });

    // Initial Cursor Position
    gsap.set(cursor, { x: window.innerWidth * 0.8, y: window.innerHeight * 0.8 });

    // Set scale to fit 1440px width reasonably for cinematic view
    gsap.set(worldStage, { scale: 0.7 });

    // Preloader Promise
    const iframes = document.querySelectorAll('iframe');
    let loadedCount = 0;

    const checkIframesLoaded = new Promise((resolve) => {
      if (iframes.length === 0) resolve();

      // Fallback timeout in case of CORS or load issues (e.g., placeholder URLs)
      const fallback = setTimeout(() => resolve(), 3000);

      iframes.forEach(iframe => {
        iframe.onload = () => {
          loadedCount++;
          if (loadedCount === iframes.length) {
            clearTimeout(fallback);
            resolve();
          }
        };
        // Also resolve if already loaded or error
        iframe.onerror = () => {
          loadedCount++;
          if (loadedCount === iframes.length) {
            clearTimeout(fallback);
            resolve();
          }
        };
      });
    });

    checkIframesLoaded.then(() => {
      // Fade out loader
      loader.style.opacity = '0';
      setTimeout(() => {
        loader.style.display = 'none';
        startCinematicTimeline();
      }, 800);
    });

    function startCinematicTimeline() {
      // Strict 25-second Master Timeline
      const masterTl = gsap.timeline();

      // --- [0s - 5s] Intro pan and Domain Claim focus ---
      masterTl.addLabel("intro", 0)
        // Simulate scrolling down the domain page
        .to(scrollingIframe, {
          duration: 4,
          y: -1000,
          ease: "power4.inOut"
        }, "intro")
        // Move cursor smoothly into position
        .to(cursor, {
          duration: 2.5,
          x: window.innerWidth * 0.5,
          y: window.innerHeight * 0.6,
          ease: "power4.inOut"
        }, "intro+=1")
        // Click interaction
        .to(cursor, {
          duration: 0.1,
          scale: 0.8,
          ease: "power1.inOut"
        }, "intro+=4.5")
        .to(cursor, {
          duration: 0.2,
          scale: 1,
          ease: "back.out(1.2)"
        }, "intro+=4.6");

      // --- [5s - 10s] Domain success modal and hold ---
      masterTl.addLabel("success", 5)
        // Depth of field: blur background
        .to(domainWrapper, {
          duration: 1.5,
          filter: "blur(8px)",
          opacity: 0.4,
          ease: "power4.inOut"
        }, "success")
        // Pop up Confetti modal with premium easing
        .to(confettiModal, {
          duration: 1.2,
          autoAlpha: 1,
          scale: 1,
          ease: "back.out(1.2)"
        }, "success+=0.5")
        // Camera zooms in slightly
        .to(worldStage, {
          duration: 2,
          scale: 0.75,
          ease: "power4.inOut"
        }, "success");

      // --- [10s - 15s] Sweeping pan to E-Office ---
      masterTl.addLabel("pan", 10)
        // Close modal
        .to(confettiModal, {
          duration: 0.8,
          autoAlpha: 0,
          scale: 0.9,
          ease: "power4.inOut"
        }, "pan")
        // Remove blur from domain wrapper
        .to(domainWrapper, {
          duration: 1,
          filter: "blur(0px)",
          opacity: 1,
          ease: "power4.inOut"
        }, "pan")
        // Camera sweeping pan (rotate & translate)
        .to(worldStage, {
          duration: 4,
          x: "-100vw", // Pan left to reveal E-office on right
          rotateY: 15,  // Straighten out E-office
          scale: 0.65,  // Zoom out slightly for grand reveal
          ease: "power4.inOut"
        }, "pan")
        // Cursor sweeps over to new section
        .to(cursor, {
          duration: 3.5,
          x: window.innerWidth * 0.65,
          y: window.innerHeight * 0.45,
          ease: "power4.inOut"
        }, "pan+=0.5")
        // 3D Cascading Reveal of Iframes
        .to(cascadeItems, {
          duration: 2,
          autoAlpha: 1,
          y: 0,
          z: (i) => i * 150 + 100, // Stagger in 3D depth
          rotateX: 0,
          stagger: 0.2,
          ease: "power4.out" // More elegant reveal
        }, "pan+=1");

      // --- [15s - 20s] Bypass trigger and zoom ---
      masterTl.addLabel("bypass", 15)
        // Precision cursor adjustment
        .to(cursor, {
          duration: 1.5,
          x: window.innerWidth * 0.7,
          y: window.innerHeight * 0.3,
          ease: "power4.inOut"
        }, "bypass")
        // Click action
        .to(cursor, {
          duration: 0.1,
          scale: 0.8,
          ease: "power1.inOut"
        }, "bypass+=1.5")
        .to(cursor, {
          duration: 0.2,
          scale: 1,
          ease: "back.out(1.2)"
        }, "bypass+=1.6")
        // Show Bypass Modal with premium easing
        .to(bypassModal, {
          duration: 1.2,
          autoAlpha: 1,
          scale: 1,
          ease: "back.out(1.2)"
        }, "bypass+=2")
        // Depth of field: blur E-office cascade
        .to(cascadeItems, {
          duration: 1.5,
          filter: "blur(8px)",
          opacity: 0.4,
          ease: "power4.inOut"
        }, "bypass+=1.5")
        // Camera zoom in on modal
        .to(worldStage, {
          duration: 2.5,
          scale: 0.85,
          ease: "power4.inOut"
        }, "bypass+=1.5");

      // --- [20s - 25s] Rapid resolution cascade and final 3D float hold ---
      masterTl.addLabel("resolution", 20)
        // Resolve checklist items sequentially but quickly
        .to("#chk-email", { duration: 0.2, onStart: () => document.getElementById('chk-email').classList.add('resolved') }, "resolution")
        .to("#chk-chat", { duration: 0.2, onStart: () => document.getElementById('chk-chat').classList.add('resolved') }, "resolution+=0.3")
        .to("#chk-boards", { duration: 0.2, onStart: () => document.getElementById('chk-boards').classList.add('resolved') }, "resolution+=0.6")
        .to("#chk-calendar", { duration: 0.2, onStart: () => document.getElementById('chk-calendar').classList.add('resolved') }, "resolution+=0.9")
        // Close modal smoothly
        .to(bypassModal, {
          duration: 0.8,
          autoAlpha: 0,
          scale: 0.9,
          ease: "power4.inOut"
        }, "resolution+=2")
        // Remove blur
        .to(cascadeItems, {
          duration: 1.5,
          filter: "blur(0px)",
          opacity: 1,
          ease: "power4.inOut"
        }, "resolution+=2")
        // Final float hold: very slow pan/zoom to end of timeline
        .to(worldStage, {
          duration: 3,
          scale: 0.7,
          rotateX: 5,
          rotateY: 10,
          ease: "power4.inOut"
        }, "resolution+=2");
    }
  </script>
</body>
</html>
