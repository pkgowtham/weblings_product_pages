<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weblings Worksuite - Scene 2</title>
    <!-- GSAP via CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/CustomEase.min.js"></script>
    
    <style>
        :root {
            --brand-blue: #0072C4;
            --surface-lighter: #E6F2FF;
            --surface-inverse: #262626;
            --green-accent: #10B981; 
            --slate-navy: #0F172A; 
            --purple: #9333EA; 
            --bg-light: #F4F6F9; 
            --surface-white: #ffffff;
            --border-light: #d9d9d9;
            --text-dark: #262626;
            --text-gray: #595959;
        }

        * { box-sizing: border-box; }

        body, html {
            margin: 0;
            padding: 0;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
            background: var(--bg-light) !important;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        /* Prevent any scrolling on body, overlays */
        .overlay, .mask, body::before, body::after, #world-stage::before, #world-stage::after {
            display: none !important;
        }

        #viewport {
            width: 100vw;
            height: 100vh;
            perspective: 1200px;
            transform-style: preserve-3d;
            position: relative;
            overflow: hidden;
        }
        
        #ambient-bg {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 150vw;
            height: 150vh;
            transform: translate(-50%, -50%);
            /* Mild, subtle radial gradient: #E6F2FF and a 5% opacity hint of #0072C4 */
            background: radial-gradient(circle at center, var(--surface-lighter) 0%, rgba(0, 114, 196, 0.05) 50%, transparent 100%);
            opacity: 1; /* Not animated for Scene 2 */
            border-radius: 50%;
            filter: blur(80px);
            z-index: 0;
            pointer-events: none;
        }

        #world-stage {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            transform-style: preserve-3d;
            z-index: 10;
            will-change: transform;
        }

        /* Iframe Preloader */
        #preloader {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: var(--slate-navy);
            z-index: 9999;
            display: flex;
            align-items: center;
            justify-content: center;
            will-change: opacity;
        }

        .spinner {
            width: 60px;
            height: 60px;
            border: 4px solid rgba(255, 255, 255, 0.2);
            border-top: 4px solid #fff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

    </style>
</head>
<body>
    <div id="preloader"><div class="spinner"></div></div>
    
    <div id="viewport">
        <div id="ambient-bg"></div>
        <div id="world-stage">
            <div id="scene-container">
                <!-- Front Iframe: Mail -->
                <div id="mail-wrapper" class="iframe-wrapper">
                    <iframe id="mail-frame" class="iframe-content" src="http://localhost:3000/mail"></iframe>
                </div>
                
                <!-- Back Iframe: Agile Board -->
                <div id="agile-wrapper" class="iframe-wrapper">
                    <iframe id="agile-frame" class="iframe-content" src="http://localhost:3000/streamline"></iframe>
                </div>
                
                <!-- 3D Overlays for Mail Front -->
                <div id="front-overlays" class="overlay-layer">
                    <div class="glass-badge badge-alex">alex@acme.io</div>
                    <div class="glass-badge badge-billing">billing@acme.io</div>
                    <div class="glass-badge badge-support">support@acme.io</div>
                    <div class="glass-badge badge-unified" id="badge-unified">✨ Unified Login</div>
                    
                    <div class="heavy-attachment" id="heavy-attachment">
                        <div class="attachment-icon">🎥</div>
                        <div class="attachment-details">
                            <span class="attachment-title">Client_Promo_RAW.mp4</span>
                            <span class="attachment-size">4.2 GB • 10GB Limit</span>
                        </div>
                    </div>
                    
                    <div class="convert-button" id="convert-button">Convert to Agile Ticket</div>
                </div>
            </div>
        </div>
        
        <!-- Virtual Cursor -->
        <svg id="virtual-cursor" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M5.5 3.21V20.8c0 .45.54.67.85.35l4.86-4.86a.5.5 0 0 1 .35-.15h6.94c.45 0 .67-.54.35-.85L5.85 2.86a.5.5 0 0 0-.85.35Z" fill="#111827" stroke="#ffffff" stroke-width="2"/>
        </svg>
    </div>
<style>
        /* Iframe Styles */
        .iframe-wrapper {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 1440px;
            height: 900px;
            margin-top: -450px;
            margin-left: -720px;
            border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.1);
            box-shadow: 0 40px 100px rgba(0,0,0,0.4);
            overflow: hidden;
            transform-style: preserve-3d;
            backface-visibility: hidden;
            background: var(--surface-white);
            will-change: transform;
        }

        .iframe-content {
            width: 1440px;
            height: 2500px;
            border: none;
            pointer-events: none;
            transform-origin: center center;
            will-change: transform;
        }
        
        .iframe-content::-webkit-scrollbar {
            display: none;
        }
        
        #scene-container {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            transform-style: preserve-3d;
        }

        #mail-wrapper {
            transform: translateZ(1px); /* Just slightly in front */
        }

        #agile-wrapper {
            transform: rotateY(180deg) translateZ(1px);
        }
</style>
<style>
        /* 3D Overlays */
        .overlay-layer {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            transform-style: preserve-3d;
        }

        /* Glassmorphic Badges */
        .glass-badge {
            position: absolute;
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.4);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            border-radius: 30px;
            padding: 12px 24px;
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--text-dark);
            opacity: 0;
            transform: translateZ(500px);
            will-change: transform, opacity;
        }

        .badge-alex { top: 30%; left: 40%; }
        .badge-billing { top: 40%; left: 60%; }
        .badge-support { top: 50%; left: 35%; }
        
        .badge-unified {
            top: 40%; left: 50%;
            margin-left: -90px; /* approx center */
            background: var(--brand-blue);
            color: white;
            border: none;
            box-shadow: 0 15px 40px rgba(0, 114, 196, 0.4);
            display: none;
            font-size: 1.2rem;
            padding: 16px 32px;
        }

        /* Heavy Attachment Drop */
        .heavy-attachment {
            position: absolute;
            top: 50%; left: 50%;
            width: 400px;
            margin-left: -200px;
            margin-top: -60px;
            background: white;
            border-radius: 16px;
            border: 1px solid var(--border-light);
            box-shadow: 0 50px 100px rgba(0,0,0,0.2);
            padding: 24px;
            display: flex;
            align-items: center;
            gap: 20px;
            transform: translateY(-1000px) translateZ(300px);
            opacity: 0;
            will-change: transform, opacity;
        }

        .attachment-icon {
            width: 48px; height: 48px;
            background: var(--surface-lighter);
            border-radius: 12px;
            display: flex; align-items: center; justify-content: center;
            font-size: 24px;
        }

        .attachment-details {
            display: flex; flex-direction: column; gap: 4px;
        }

        .attachment-title {
            font-weight: 600; font-size: 1.1rem; color: var(--text-dark);
        }

        .attachment-size {
            font-size: 0.9rem; color: var(--text-gray);
        }

        /* Convert Button & Cursor */
        .convert-button {
            position: absolute;
            top: 65%; left: 50%;
            margin-left: -120px;
            background: var(--green-accent);
            color: white;
            padding: 16px 32px;
            border-radius: 12px;
            font-weight: 600;
            font-size: 1.1rem;
            box-shadow: 0 10px 30px rgba(16, 185, 129, 0.3);
            transform: translateZ(150px) scale(0);
            opacity: 0;
            will-change: transform, opacity;
        }

        #virtual-cursor {
            position: absolute;
            width: 32px;
            height: 32px;
            z-index: 999;
            opacity: 0;
            transform: translate(100vw, 100vh);
            will-change: transform, opacity;
            pointer-events: none;
        }
</style>
<script>
document.addEventListener("DOMContentLoaded", () => {
    gsap.registerPlugin(CustomEase);

    // Initial setups
    gsap.set("#world-stage", { translateX: 2000 });
    gsap.set(".iframe-wrapper", { scale: 0.8 });
    gsap.set(".glass-badge:not(.badge-unified)", { z: 500, opacity: 0 });

    const frames = [document.getElementById("mail-frame"), document.getElementById("agile-frame")];
    
    // Iframe Preloader Logic
    const loadPromises = frames.map(frame => {
        return new Promise(resolve => {
            if (frame.contentDocument && frame.contentDocument.readyState === 'complete') {
                resolve();
            } else {
                frame.addEventListener('load', resolve, { once: true });
                frame.addEventListener('error', resolve, { once: true });
            }
        });
    });

    Promise.all(loadPromises).then(() => {
        // Wait 3.5s for React Hydration as per guidelines
        setTimeout(() => {
            const preloader = document.getElementById('preloader');
            gsap.to(preloader, {
                opacity: 0,
                duration: 0.5,
                onComplete: () => {
                    preloader.style.display = 'none';
                    startAnimation();
                }
            });
        }, 3500);
    });

    function startAnimation() {
        const tl = gsap.timeline();
        
        // --- BEAT 1: The Inbox Whip (0.0s - 4.0s) ---
        tl.addLabel("inboxWhip", 0)
          .to("#world-stage", {
              translateX: 0,
              duration: 2,
              ease: "expo.out"
          }, "inboxWhip")
          .to(".iframe-wrapper", {
              scale: 1,
              duration: 2,
              ease: "expo.out"
          }, "inboxWhip");

        // --- BEAT 2: The Unified Alias Cascade (4.0s - 9.0s) ---
        tl.addLabel("aliasCascade", 4.0)
          // Start Mail Scroll
          .to("#mail-frame", {
              y: -600,
              duration: 8,
              ease: "power1.inOut"
          }, "aliasCascade")
          // Fly in
          .to([".badge-alex", ".badge-billing", ".badge-support"], {
              opacity: 1,
              z: 150,
              duration: 1,
              stagger: 0.2,
              ease: "back.out(1.5)"
          }, "aliasCascade")
          // Small float
          .to([".badge-alex", ".badge-billing", ".badge-support"], {
              y: "-=10",
              duration: 1.5,
              yoyo: true,
              repeat: 1,
              ease: "sine.inOut"
          }, "aliasCascade+=1")
          // Collapse together
          .to([".badge-alex", ".badge-billing", ".badge-support"], {
              top: "40%",
              left: "50%",
              xPercent: -50,
              yPercent: -50,
              z: 50,
              opacity: 0,
              duration: 0.8,
              ease: "power4.in"
          }, "aliasCascade+=2.5")
          // Snap Unified Badge
          .set(".badge-unified", { display: "block", scale: 0.5, opacity: 0 }, "aliasCascade+=3.2")
          .to(".badge-unified", {
              scale: 1,
              opacity: 1,
              duration: 0.8,
              ease: "back.out(2)"
          }, "aliasCascade+=3.2")
          // Fade Unified Badge out before next beat
          .to(".badge-unified", { opacity: 0, duration: 0.5 }, "aliasCascade+=4.5");

        // --- BEAT 3: The Heavy Attachment Drop (9.0s - 14.0s) ---
        tl.addLabel("attachmentDrop", 9.0)
          .to("#heavy-attachment", {
              y: 0,
              opacity: 1,
              duration: 1,
              ease: "bounce.out"
          }, "attachmentDrop")
          // Camera Shake using rough-like fast yoyos
          .to("#world-stage", {
              y: 20,
              x: 10,
              duration: 0.05,
              yoyo: true,
              repeat: 5,
              ease: "none"
          }, "attachmentDrop+=0.2")
          .to("#world-stage", { y: 0, x: 0, duration: 0.1 }, "attachmentDrop+=0.5")
          // Fade attachment out
          .to("#heavy-attachment", { opacity: 0, y: 100, duration: 0.5 }, "attachmentDrop+=4");

        // --- BEAT 4: The 3D Context Flip (14.0s - 20.0s) ---
        tl.addLabel("contextFlip", 14.0)
          // Pop button in
          .to("#convert-button", {
              scale: 1,
              opacity: 1,
              duration: 0.8,
              ease: "back.out(1.5)"
          }, "contextFlip")
          // Cursor sweeps in to click
          .to("#virtual-cursor", {
              x: window.innerWidth * 0.5 + 20,
              y: window.innerHeight * 0.65 + 10,
              opacity: 1,
              duration: 1,
              ease: "power2.out"
          }, "contextFlip+=0.5")
          // Click effect
          .to("#convert-button", { scale: 0.9, duration: 0.1 }, "contextFlip+=1.6")
          .to("#convert-button", { scale: 1, duration: 0.1 }, "contextFlip+=1.7")
          
          // Massive 3D Transition
          .to("#front-overlays", { opacity: 0, duration: 0.3 }, "contextFlip+=1.8")
          .to("#virtual-cursor", { opacity: 0, duration: 0.3 }, "contextFlip+=1.8")
          
          // Push back, rotate, pull in
          .to("#scene-container", {
              z: -500,
              duration: 1,
              ease: "power2.inOut"
          }, "contextFlip+=1.8")
          .to("#scene-container", {
              rotationY: 180,
              duration: 1.5,
              ease: "power3.inOut"
          }, "contextFlip+=2.3")
          .to("#scene-container", {
              z: 0,
              duration: 1,
              ease: "power2.out"
          }, "contextFlip+=3.3")
          
          // Start Agile Board Scroll
          .to("#agile-frame", {
              y: -800,
              duration: 5,
              ease: "power2.inOut"
          }, "contextFlip+=3.8")
          
          // Cinematic Float for the remainder
          .to("#scene-container", {
              y: 20,
              rotationX: 2,
              duration: 3,
              yoyo: true,
              repeat: -1,
              ease: "sine.inOut"
          }, "contextFlip+=4");
    }
});
</script>
</body>
</html>
