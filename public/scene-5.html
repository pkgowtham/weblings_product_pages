<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weblings Worksuite - Scene 5</title>
    <!-- GSAP via CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/CustomEase.min.js"></script>

    <style>
        :root {
            --brand-blue: #0072C4;
            --surface-lighter: #E6F2FF;
            --surface-inverse: #262626;
            --green-accent: #10B981;
            --slate-navy: #0F172A;
            --purple: #9333EA;
            --bg-light: #F4F6F9;
            --surface-white: #ffffff;
            --border-light: #d9d9d9;
            --text-dark: #262626;
            --text-gray: #595959;
            --red-badge: #EF4444;
            --red-bg: #FEF2F2;
        }

        * { box-sizing: border-box; }

        body, html {
            margin: 0;
            padding: 0;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
            background: var(--bg-light) !important;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        .overlay, .mask, body::before, body::after, #world-stage::before, #world-stage::after {
            display: none !important;
        }

        #viewport {
            width: 100vw;
            height: 100vh;
            perspective: 1200px;
            transform-style: preserve-3d;
            position: relative;
            overflow: hidden;
        }

        #ambient-bg {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 150vw;
            height: 150vh;
            transform: translate(-50%, -50%);
            background: radial-gradient(circle at center, var(--surface-lighter) 0%, rgba(0, 114, 196, 0.05) 50%, transparent 100%);
            border-radius: 50%;
            filter: blur(80px);
            z-index: 0;
            pointer-events: none;
        }

        #world-stage {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            transform-style: preserve-3d;
            z-index: 10;
            will-change: transform;
        }

        /* Iframe Preloader */
        #preloader {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: var(--slate-navy);
            z-index: 9999;
            display: flex;
            align-items: center;
            justify-content: center;
            will-change: opacity;
        }

        .spinner {
            width: 60px;
            height: 60px;
            border: 4px solid rgba(255, 255, 255, 0.2);
            border-top: 4px solid #fff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        /* Iframe Styles */
        .iframe-wrapper {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 1440px;
            height: 900px;
            margin-top: -450px;
            margin-left: -720px;
            border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.1);
            box-shadow: 0 40px 100px rgba(0,0,0,0.4);
            overflow: hidden;
            background: var(--surface-white);
            will-change: filter, transform;
            transform-style: preserve-3d;
        }

        .iframe-content {
            width: 1440px;
            height: 2500px; /* Tall to allow scrolling */
            border: none;
            pointer-events: none;
            transform-origin: center center;
            will-change: transform;
        }

        .iframe-content::-webkit-scrollbar {
            display: none;
        }

        /* 3D Overlays Layer */
        .overlay-layer {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            transform-style: preserve-3d;
        }

        /* Event Blocks */
        .event-block {
            position: absolute;
            width: 250px;
            height: 80px;
            border-radius: 8px;
            color: white;
            padding: 12px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
            z-index: 20;
            opacity: 0;
            transform: translateZ(50px);
            will-change: transform, opacity;
        }

        #block-1 {
            background: var(--brand-blue);
            top: 350px; left: 300px;
        }

        #block-2 {
            background: var(--purple);
            top: 350px; left: 700px;
        }

        .event-title { font-weight: bold; font-size: 1.1rem; }
        .event-time { font-size: 0.9rem; opacity: 0.8; }

        /* Warning Modal */
        .warning-modal {
            position: absolute;
            top: 50%; left: 50%;
            width: 500px;
            margin-top: -100px;
            margin-left: -250px;
            background: var(--red-bg);
            border: 2px solid var(--red-badge);
            border-radius: 12px;
            padding: 30px;
            text-align: center;
            box-shadow: 0 20px 50px rgba(239, 68, 68, 0.4), 0 0 40px rgba(239, 68, 68, 0.2);
            z-index: 50;
            opacity: 0;
            transform: scale(0) translateZ(200px);
            will-change: transform, opacity;
        }

        .warning-icon {
            font-size: 40px;
            margin-bottom: 10px;
        }

        .warning-text {
            color: #7F1D1D;
            font-size: 1.5rem;
            font-weight: bold;
            line-height: 1.4;
        }

        /* Digital Clocks */
        .clock-container {
            position: absolute;
            top: 15%; left: 50%;
            width: 800px;
            margin-left: -400px;
            display: flex;
            justify-content: space-between;
            z-index: 30;
            transform-style: preserve-3d;
        }

        .digital-clock {
            width: 300px;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid var(--border-light);
            border-radius: 16px;
            padding: 20px;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            opacity: 0;
            transform: translateZ(100px);
            will-change: transform, opacity;
        }

        .clock-location {
            font-size: 1.1rem;
            color: var(--text-gray);
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 5px;
        }

        .clock-time {
            font-family: monospace;
            font-size: 2.5rem;
            font-weight: bold;
            color: var(--text-dark);
        }

        /* Cursor */
        #virtual-cursor {
            position: absolute;
            width: 32px;
            height: 32px;
            z-index: 999;
            opacity: 0;
            transform: translate(100vw, 100vh);
            will-change: transform, opacity;
            pointer-events: none;
        }

    </style>
</head>
<body>
    <div id="preloader"><div class="spinner"></div></div>

    <div id="viewport">
        <div id="ambient-bg"></div>

        <div id="world-stage">

            <div id="calendar-wrapper" class="iframe-wrapper">
                <iframe id="calendar-frame" class="iframe-content" src="http://localhost:3000/calendar"></iframe>

                <!-- Event Blocks (inside wrapper coordinate space for dragging accuracy) -->
                <div class="event-block" id="block-1">
                    <div class="event-title">Migrate Payments</div>
                    <div class="event-time">STR-104</div>
                </div>
                <div class="event-block" id="block-2">
                    <div class="event-title">Client UI Review</div>
                    <div class="event-time">LIVE</div>
                </div>
            </div>

            <div class="overlay-layer">

                <!-- Warning Modal -->
                <div class="warning-modal" id="warning-modal">
                    <div class="warning-icon">🚨</div>
                    <div class="warning-text">CAPACITY WARNING:<br>Assignee on leave.</div>
                </div>

                <!-- Digital Clocks -->
                <div class="clock-container">
                    <div class="digital-clock" id="clock-london">
                        <div class="clock-location">London</div>
                        <div class="clock-time" id="time-london">--:-- --</div>
                    </div>
                    <div class="digital-clock" id="clock-india">
                        <div class="clock-location">India</div>
                        <div class="clock-time" id="time-india">--:-- --</div>
                    </div>
                </div>

            </div>

        </div>

        <!-- Virtual Cursor -->
        <svg id="virtual-cursor" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M5.5 3.21V20.8c0 .45.54.67.85.35l4.86-4.86a.5.5 0 0 1 .35-.15h6.94c.45 0 .67-.54.35-.85L5.85 2.86a.5.5 0 0 0-.85.35Z" fill="#111827" stroke="#ffffff" stroke-width="2"/>
        </svg>

    </div>

    <script>
    document.addEventListener("DOMContentLoaded", () => {
        gsap.registerPlugin(CustomEase);

        const frame = document.getElementById("calendar-frame");

        // Iframe Preloader
        const loadPromise = new Promise(resolve => {
            if (frame.contentDocument && frame.contentDocument.readyState === 'complete') {
                resolve();
            } else {
                frame.addEventListener('load', resolve, { once: true });
                frame.addEventListener('error', resolve, { once: true });
            }
        });

        loadPromise.then(() => {
            // 3.5s Hydration Delay
            setTimeout(() => {
                const preloader = document.getElementById('preloader');
                gsap.to(preloader, {
                    opacity: 0,
                    duration: 0.5,
                    onComplete: () => {
                        preloader.style.display = 'none';
                        startAnimation();
                    }
                });
            }, 3500);
        });

        function startAnimation() {
            const tl = gsap.timeline();

            // --- BEAT 1: The Auto-Sync Assembly (0.0s - 6.0s) ---
            tl.addLabel("assembly", 0)
              // Camera pushes in from top-down
              .fromTo("#world-stage",
                  { rotationX: 30, y: -300 },
                  { rotationX: 0, y: 0, duration: 3.5, ease: "power3.inOut" },
                  "assembly"
              )
              // Blocks fly in and snap
              .fromTo("#block-1",
                  { x: -1000, opacity: 0 },
                  { x: 0, opacity: 1, duration: 1.5, ease: "back.out(1.5)" },
                  "assembly+=2.5"
              )
              .fromTo("#block-2",
                  { x: 1000, opacity: 0 },
                  { x: 0, opacity: 1, duration: 1.5, ease: "back.out(1.5)" },
                  "assembly+=2.8"
              );

            // --- BEAT 2: The Drag & Drop (6.0s - 10.0s) ---
            tl.addLabel("dragDrop", 6.0)
              // Cursor sweeps in to Block 1 (Migrate Payments)
              // Wrapper top is (innerHeight - 900)/2. Block 1 is at top 350, left 300 inside wrapper.
              .to("#virtual-cursor", {
                  x: window.innerWidth/2 - 720 + 300 + 125, // roughly center of block
                  y: window.innerHeight/2 - 450 + 350 + 40,
                  opacity: 1,
                  duration: 1.5,
                  ease: "power2.out"
              }, "dragDrop")

              // Click
              .to("#virtual-cursor", { scale: 0.9, duration: 0.1 }, "dragDrop+=1.6")
              .to("#block-1", { scale: 1.05, boxShadow: "0 20px 40px rgba(0,0,0,0.3)", z: 100, duration: 0.1 }, "dragDrop+=1.6")

              // Drag diagonally
              .to(["#virtual-cursor", "#block-1"], {
                  x: "+=250",
                  y: "+=250",
                  duration: 1.8,
                  ease: "power2.inOut"
              }, "dragDrop+=1.8")

              // Drop
              .to("#virtual-cursor", { scale: 1, duration: 0.1 }, "dragDrop+=3.8")
              .to("#block-1", { scale: 1, boxShadow: "0 10px 20px rgba(0,0,0,0.2)", z: 50, duration: 0.1 }, "dragDrop+=3.8");

            // --- BEAT 3: The HR Collision Shield (10.0s - 15.0s) ---
            tl.addLabel("collision", 10.0)
              // Iframe blurs violently
              .to("#calendar-wrapper", { filter: "blur(12px)", duration: 0.5 }, "collision")

              // Warning modal scales up from drop point elastically
              // Position it roughly near the drop point (which moved +250, +250 from block-1 initial)
              .set("#warning-modal", {
                  left: "50%",
                  top: "50%",
                  marginLeft: (300 + 250 - 720), // approx match to grid space
                  marginTop: (350 + 250 - 450 - 50)
              }, "collision")
              .fromTo("#warning-modal",
                  { scale: 0, opacity: 0 },
                  { scale: 1, opacity: 1, duration: 1.5, ease: "elastic.out(1, 0.5)" },
                  "collision+=0.2"
              );

            // --- BEAT 4: The Timezone Normalization (15.0s - 20.0s) ---
            tl.addLabel("timezone", 15.0)
              // Modal and cursor fade out
              .to(["#warning-modal", "#virtual-cursor"], { opacity: 0, scale: 0.8, duration: 0.5 }, "timezone")

              // Camera pulls back gently
              .to("#world-stage", { scale: 0.9, duration: 3, ease: "power2.inOut" }, "timezone")

              // Clocks fly in and spin
              .fromTo(["#clock-london", "#clock-india"],
                  { opacity: 0, rotationY: 180, z: -500 },
                  { opacity: 1, rotationY: 0, z: 100, duration: 1.5, stagger: 0.2, ease: "power3.out" },
                  "timezone+=0.5"
              );

            // Flickering numbers effect
            const flickers = 10;
            const londonTime = document.getElementById('time-london');
            const indiaTime = document.getElementById('time-india');

            for(let i=0; i<flickers; i++) {
                tl.call(() => {
                    londonTime.innerText = `${Math.floor(Math.random()*12+1)}:${Math.floor(Math.random()*60).toString().padStart(2, '0')} AM`;
                    indiaTime.innerText = `${Math.floor(Math.random()*12+1)}:${Math.floor(Math.random()*60).toString().padStart(2, '0')} PM`;
                }, null, `timezone+=${0.6 + i*0.1}`);
            }

            // Lock final times
            tl.call(() => {
                londonTime.innerText = "10:00 AM GMT";
                indiaTime.innerText = "3:30 PM IST";
            }, null, `timezone+=${0.6 + flickers*0.1}`);

            // Final Gentle Float
            tl.to("#world-stage", {
                y: -15,
                duration: 3,
                yoyo: true,
                repeat: -1,
                ease: "sine.inOut"
            }, "timezone+=2.0");
        }
    });
    </script>
</body>
</html>
