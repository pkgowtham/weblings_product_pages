<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weblings Worksuite - Scene 5 (Static Highlight)</title>
    <!-- GSAP via CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/CustomEase.min.js"></script>

    <style>
        :root {
            --brand-blue: #0072C4;
            --surface-lighter: #E6F2FF;
            --surface-inverse: #262626;
            --green-accent: #10B981;
            --slate-navy: #0F172A;
            --purple: #9333EA;
            --bg-light: #F4F6F9;
            --surface-white: #ffffff;
            --border-light: #d9d9d9;
            --text-dark: #262626;
            --text-gray: #595959;
            --red-badge: #EF4444;
            --red-bg: #FEF2F2;
        }

        * { box-sizing: border-box; }

        body, html {
            margin: 0;
            padding: 0;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
            background: var(--bg-light) !important;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        .overlay, .mask, body::before, body::after, #world-stage::before, #world-stage::after {
            display: none !important;
        }

        #viewport {
            width: 100vw;
            height: 100vh;
            perspective: 1200px;
            transform-style: preserve-3d;
            position: relative;
            overflow: hidden;
        }

        #ambient-bg {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 150vw;
            height: 150vh;
            transform: translate(-50%, -50%);
            background: radial-gradient(circle at center, var(--surface-lighter) 0%, rgba(0, 114, 196, 0.05) 50%, transparent 100%);
            border-radius: 50%;
            filter: blur(80px);
            z-index: 0;
            pointer-events: none;
        }

        #world-stage {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            transform-style: preserve-3d;
            z-index: 10;
            will-change: transform;
        }

        /* Iframe Styles */
        .iframe-wrapper {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 1440px;
            height: 900px;
            margin-top: -450px;
            margin-left: -720px;
            border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.1);
            box-shadow: 0 40px 100px rgba(0,0,0,0.4);
            overflow: hidden;
            background: var(--surface-white);
            will-change: filter, transform;
            transform-style: preserve-3d;
        }

        .iframe-content {
            width: 1440px;
            height: 2500px; /* Tall to allow scrolling */
            border: none;
            pointer-events: none;
            transform-origin: center center;
            will-change: transform;
        }

        .iframe-content::-webkit-scrollbar {
            display: none;
        }

        /* 3D Overlays Layer */
        .overlay-layer {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            transform-style: preserve-3d;
        }

        /* HR Warning Shield Modal */
        .warning-modal {
            position: absolute;
            top: 50%; left: 50%;
            width: 600px;
            margin-top: -150px;
            margin-left: -300px;
            background: rgba(254, 242, 242, 0.95); /* red-bg slightly glass */
            backdrop-filter: blur(10px);
            border: 2px solid var(--red-badge);
            border-radius: 16px;
            padding: 40px;
            text-align: center;
            box-shadow: 0 30px 60px rgba(239, 68, 68, 0.4), 0 0 50px rgba(239, 68, 68, 0.2);
            z-index: 50;
            opacity: 0;
            transform: scale(0) translateZ(300px);
            will-change: transform, opacity;
        }

        .warning-icon {
            font-size: 60px;
            margin-bottom: 20px;
            filter: drop-shadow(0 10px 10px rgba(239, 68, 68, 0.3));
        }

        .warning-text {
            color: #7F1D1D;
            font-size: 2rem;
            font-weight: 800;
            line-height: 1.2;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* AI Flipper Container */
        .ai-flipper-container {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 450px;
            height: 180px;
            margin-top: -90px;
            margin-left: -225px;
            perspective: 1200px;
            z-index: 40;
            opacity: 0;
            transform: scale(0) translateZ(200px);
            will-change: transform, opacity;
        }

        .ai-flipper {
            width: 100%;
            height: 100%;
            position: relative;
            transform-style: preserve-3d;
            will-change: transform;
        }

        .face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            border-radius: 16px;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.15);
            overflow: hidden; /* for scan line */
        }

        /* Front: Transcript Bubble */
        .face-front {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.5);
            padding: 30px 40px;
            display: flex;
            align-items: center;
        }

        .transcript-text {
            font-size: 1.4rem;
            font-weight: 600;
            color: var(--text-dark);
            line-height: 1.4;
            position: relative;
            z-index: 2;
        }

        .ai-sparkle {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 32px;
            height: 32px;
            fill: var(--purple);
            opacity: 0;
            z-index: 3;
            will-change: transform, opacity;
        }

        .ai-scan-line {
            position: absolute;
            top: 0;
            left: -100px;
            width: 100px;
            height: 100%;
            background: linear-gradient(to right, transparent, rgba(147, 51, 234, 0.4), transparent);
            filter: blur(5px);
            z-index: 1;
            transform: skewX(-20deg);
        }

        /* Back: Agile Ticket */
        .face-back {
            background: white;
            border: 1px solid var(--border-light);
            transform: rotateY(180deg);
            padding: 25px 30px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 15px;
        }

        .ticket-header-ai {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .ticket-id-ai {
            font-size: 1.1rem;
            color: var(--text-gray);
            font-weight: 600;
        }

        .ticket-badge-ai {
            background: var(--surface-lighter);
            color: var(--green-accent);
            font-size: 0.9rem;
            padding: 6px 12px;
            border-radius: 6px;
            font-weight: bold;
            border: 1px solid rgba(16, 185, 129, 0.2);
        }

        .ticket-title-ai {
            font-size: 1.5rem;
            font-weight: 800;
            color: var(--text-dark);
            line-height: 1.2;
        }

    </style>
</head>
<body>

    <div id="viewport">
        <div id="ambient-bg"></div>

        <div id="world-stage">

            <div id="calendar-wrapper" class="iframe-wrapper">
                <iframe id="calendar-frame" class="iframe-content" src="http://localhost:3000/calendar"></iframe>
            </div>

            <div class="overlay-layer">

                <!-- Warning Shield -->
                <div class="warning-modal" id="warning-shield">
                    <div class="warning-icon">🛡️</div>
                    <div class="warning-text">HR CAPACITY WARNING<br><span style="font-size: 1.2rem; font-weight: 600; color: #B91C1C;">Assignee on leave</span></div>
                </div>

                <!-- AI Flipper -->
                <div class="ai-flipper-container" id="ai-container">
                    <div class="ai-flipper" id="ai-flipper">
                        <!-- Front Face: Voice Transcript -->
                        <div class="face face-front">
                            <div class="ai-scan-line" id="ai-scan"></div>
                            <svg class="ai-sparkle" id="sparkle" viewBox="0 0 24 24">
                                <path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/>
                            </svg>
                            <div class="transcript-text">"Client: We need to upgrade the payment gateway."</div>
                        </div>

                        <!-- Back Face: Streamline Ticket -->
                        <div class="face face-back">
                            <div class="ticket-header-ai">
                                <span class="ticket-id-ai">STR-410</span>
                                <span class="ticket-badge-ai">Auto-Generated</span>
                            </div>
                            <div class="ticket-title-ai">Upgrade Payment Gateway</div>
                        </div>
                    </div>
                </div>

            </div>

        </div>

    </div>

    <script>
    window.onload = () => {
        gsap.registerPlugin(CustomEase);

        const tl = gsap.timeline();

        // --- BEAT 1: The Hero Reveal (0.0s - 5.0s) ---
        tl.addLabel("heroReveal", 0)
          // Camera pushes in from slight angle
          .fromTo("#world-stage",
              { rotationX: 10, scale: 0.9 },
              { rotationX: 0, scale: 1, duration: 5.0, ease: "power2.inOut" },
              "heroReveal"
          );

        // --- BEAT 2: The HR Collision Scroll (5.0s - 12.0s) ---
        tl.addLabel("hrScroll", 5.0)
          // Scroll iframe to "Reality Check"
          .to("#calendar-frame", {
              y: -800,
              duration: 4.0,
              ease: "power2.inOut"
          }, "hrScroll")
          // Blur iframe slightly
          .to("#calendar-wrapper", {
              filter: "blur(4px)",
              duration: 1.0,
              ease: "power2.inOut"
          }, "hrScroll+=3.5")
          // Massive 3D red warning shield pops up
          .fromTo("#warning-shield",
              { scale: 0, opacity: 0 },
              { scale: 1, opacity: 1, duration: 1.5, ease: "elastic.out(1, 0.5)" },
              "hrScroll+=3.8"
          )
          // Small yoyo float on shield to keep it alive
          .to("#warning-shield", {
              y: -10,
              duration: 2.0,
              yoyo: true,
              repeat: 1,
              ease: "sine.inOut"
          }, "hrScroll+=4.0");

        // --- BEAT 3: The AI Auto-Ticket Generation (12.0s - 20.0s) ---
        tl.addLabel("aiGen", 12.0)
          // Warning shield flies off
          .to("#warning-shield", {
              y: -1000,
              opacity: 0,
              duration: 0.8,
              ease: "power3.in"
          }, "aiGen")
          // Remove blur
          .to("#calendar-wrapper", { filter: "blur(0px)", duration: 0.5 }, "aiGen")

          // Scroll to AI / Meeting Section
          .to("#calendar-frame", {
              y: -1200,
              duration: 2.5,
              ease: "power2.inOut"
          }, "aiGen+=0.5")

          // Camera zooms tightly
          .to("#world-stage", {
              scale: 1.15,
              duration: 2.0,
              ease: "power2.inOut"
          }, "aiGen+=1.0")

          // Transcript Bubble pops out
          .fromTo("#ai-container",
              { scale: 0, opacity: 0 },
              { scale: 1, opacity: 1, duration: 1.2, ease: "back.out(1.5)" },
              "aiGen+=2.5"
          )

          // AI Sparkle appears and spins
          .to("#sparkle", {
              opacity: 1,
              rotation: 360,
              duration: 1.0,
              ease: "power1.inOut"
          }, "aiGen+=3.0")

          // Scan line sweeps across
          .to("#ai-scan", {
              left: "500px",
              duration: 1.2,
              ease: "power2.inOut"
          }, "aiGen+=3.2")

          // Sparkle fades
          .to("#sparkle", { opacity: 0, duration: 0.3 }, "aiGen+=4.2")

          // Violent Flip to Ticket
          .to("#ai-flipper", {
              rotationY: 180,
              duration: 0.8,
              ease: "back.out(1.2)"
          }, "aiGen+=4.4")

          // Infinite Float
          .to("#world-stage", {
              y: -15,
              duration: 3,
              yoyo: true,
              repeat: -1,
              ease: "sine.inOut"
          }, "aiGen+=5.2");
    };
    </script>
</body>
</html>
