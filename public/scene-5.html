<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weblings Worksuite - Scene 5 (Static Highlight)</title>
    <!-- GSAP via CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/CustomEase.min.js"></script>

    <style>
        :root {
            --brand-blue: #0072C4;
            --surface-lighter: #E6F2FF;
            --surface-inverse: #262626;
            --green-accent: #10B981;
            --slate-navy: #0F172A;
            --purple: #9333EA;
            --bg-light: #F4F6F9;
            --surface-white: #ffffff;
            --border-light: #d9d9d9;
            --text-dark: #262626;
            --text-gray: #595959;
            --red-badge: #EF4444;
            --red-bg: #FEF2F2;
        }

        * { box-sizing: border-box; }

        body, html {
            margin: 0;
            padding: 0;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
            background: var(--bg-light) !important;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        .overlay, .mask, body::before, body::after, #world-stage::before, #world-stage::after {
            display: none !important;
        }

        #viewport {
            width: 100vw;
            height: 100vh;
            perspective: 1200px;
            transform-style: preserve-3d;
            position: relative;
            overflow: hidden;
        }

        #ambient-bg {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 150vw;
            height: 150vh;
            transform: translate(-50%, -50%);
            background: radial-gradient(circle at center, var(--surface-lighter) 0%, rgba(0, 114, 196, 0.05) 50%, transparent 100%);
            border-radius: 50%;
            filter: blur(80px);
            z-index: 0;
            pointer-events: none;
        }

        #world-stage {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            transform-style: preserve-3d;
            z-index: 10;
            will-change: transform;
        }

        /* Iframe Styles */
        .iframe-wrapper {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 1440px;
            height: 900px;
            margin-top: -450px;
            margin-left: -720px;
            border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.1);
            box-shadow: 0 40px 100px rgba(0,0,0,0.4);
            overflow: hidden;
            background: var(--surface-white);
            will-change: filter, transform;
            transform-style: preserve-3d;
        }

        .iframe-content {
            width: 1440px;
            height: 2500px; /* Tall to allow scrolling */
            border: none;
            pointer-events: none;
            transform-origin: center center;
            will-change: transform;
        }

        .iframe-content::-webkit-scrollbar {
            display: none;
        }

        /* 3D Overlays Layer */
        .overlay-layer {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            transform-style: preserve-3d;
        }

        /* HR Warning Shield Modal */
        .warning-modal {
            position: absolute;
            top: 50%; left: 50%;
            width: 600px;
            margin-top: -150px;
            margin-left: -300px;
            background: rgba(254, 242, 242, 0.95); /* red-bg slightly glass */
            backdrop-filter: blur(10px);
            border: 2px solid var(--red-badge);
            border-radius: 16px;
            padding: 40px;
            text-align: center;
            box-shadow: 0 30px 60px rgba(239, 68, 68, 0.4), 0 0 50px rgba(239, 68, 68, 0.2);
            z-index: 50;
            opacity: 0;
            transform: scale(0) translateZ(300px);
            will-change: transform, opacity;
        }

        .warning-icon {
            font-size: 60px;
            margin-bottom: 20px;
            filter: drop-shadow(0 10px 10px rgba(239, 68, 68, 0.3));
        }

        .warning-text {
            color: #7F1D1D;
            font-size: 2rem;
            font-weight: 800;
            line-height: 1.2;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* Timezone Clocks */
        .tz-clock {
            position: absolute;
            top: 50%;
            left: 50%;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.5);
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.15);
            border-radius: 16px;
            padding: 24px 32px;
            text-align: center;
            z-index: 40;
            opacity: 0;
            transform: scale(0) translateZ(-500px); /* Start small and deep */
            will-change: transform, opacity;
        }

        #clock-utc {
            margin-top: -50px;
            margin-left: -400px;
        }

        #clock-local {
            margin-top: -50px;
            margin-left: 100px;
        }

        .tz-label {
            font-size: 1rem;
            color: var(--text-gray);
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 8px;
        }

        .tz-time {
            font-family: monospace;
            font-size: 2.5rem;
            font-weight: 800;
            color: var(--text-dark);
            min-width: 200px; /* Prevent jitter during slot spin */
        }

        /* Auto-Converted Badge */
        .tz-badge {
            position: absolute;
            top: 50%;
            left: 50%;
            margin-top: -20px;
            margin-left: -110px; /* Center between clocks */
            background: var(--green-accent);
            color: white;
            padding: 12px 24px;
            border-radius: 30px;
            font-weight: bold;
            font-size: 1.1rem;
            box-shadow: 0 10px 30px rgba(16, 185, 129, 0.5);
            z-index: 45;
            opacity: 0;
            transform: scale(0) translateZ(100px);
            white-space: nowrap;
            will-change: transform, opacity;
        }

    </style>
</head>
<body>

    <div id="viewport">
        <div id="ambient-bg"></div>

        <div id="world-stage">

            <div id="calendar-wrapper" class="iframe-wrapper">
                <iframe id="calendar-frame" class="iframe-content" src="http://localhost:3000/calendar"></iframe>
            </div>

            <div class="overlay-layer">

                <!-- Warning Shield -->
                <div class="warning-modal" id="warning-shield">
                    <div class="warning-icon">🛡️</div>
                    <div class="warning-text">HR CAPACITY WARNING<br><span style="font-size: 1.2rem; font-weight: 600; color: #B91C1C;">Assignee on leave</span></div>
                </div>

                <!-- Timezone Intelligence -->
                <div class="tz-clock" id="clock-utc">
                    <div class="tz-label">UTC</div>
                    <div class="tz-time">10:00 AM</div>
                </div>

                <div class="tz-badge" id="tz-badge">Auto-Converted</div>

                <div class="tz-clock" id="clock-local">
                    <div class="tz-label">Local Client Time</div>
                    <div class="tz-time" id="local-time-text">--:-- --</div>
                </div>

            </div>

        </div>

    </div>

    <script>
    window.onload = () => {
        gsap.registerPlugin(CustomEase);

        const tl = gsap.timeline();

        // --- BEAT 1: The Hero Reveal (0.0s - 5.0s) ---
        tl.addLabel("heroReveal", 0)
          // Camera pushes in from slight angle
          .fromTo("#world-stage",
              { rotationX: 10, scale: 0.9 },
              { rotationX: 0, scale: 1, duration: 5.0, ease: "power2.inOut" },
              "heroReveal"
          );

        // --- BEAT 2: The HR Collision Scroll (5.0s - 12.0s) ---
        tl.addLabel("hrScroll", 5.0)
          // Scroll iframe to "Reality Check"
          .to("#calendar-frame", {
              y: -800,
              duration: 4.0,
              ease: "power2.inOut"
          }, "hrScroll")
          // Blur iframe slightly
          .to("#calendar-wrapper", {
              filter: "blur(4px)",
              duration: 1.0,
              ease: "power2.inOut"
          }, "hrScroll+=3.5")
          // Massive 3D red warning shield pops up
          .fromTo("#warning-shield",
              { scale: 0, opacity: 0 },
              { scale: 1, opacity: 1, duration: 1.5, ease: "elastic.out(1, 0.5)" },
              "hrScroll+=3.8"
          )
          // Small yoyo float on shield to keep it alive
          .to("#warning-shield", {
              y: -10,
              duration: 2.0,
              yoyo: true,
              repeat: 1,
              ease: "sine.inOut"
          }, "hrScroll+=4.0");

        // --- BEAT 3: The Timezone Normalization (12.0s - 20.0s) ---
        tl.addLabel("timezoneSync", 12.0)
          // Warning shield flies off
          .to("#warning-shield", {
              y: -1000,
              opacity: 0,
              duration: 0.8,
              ease: "power3.in"
          }, "timezoneSync")
          // Remove blur
          .to("#calendar-wrapper", { filter: "blur(0px)", duration: 0.5 }, "timezoneSync")

          // Scroll to Timezone Intelligence
          .to("#calendar-frame", {
              y: -1200,
              duration: 2.5,
              ease: "power2.inOut"
          }, "timezoneSync+=0.5")

          // Camera zooms tightly
          .to("#world-stage", {
              scale: 1.15,
              duration: 2.0,
              ease: "power2.inOut"
          }, "timezoneSync+=1.0")

          // Clocks fly out toward camera
          .fromTo(["#clock-utc", "#clock-local"],
              { scale: 0, opacity: 0, z: -500 },
              { scale: 1, opacity: 1, z: 200, duration: 1.5, stagger: 0.2, ease: "back.out(1.5)" },
              "timezoneSync+=2.5"
          );

          // Slot machine spin for local time
          const localTimeEl = document.getElementById("local-time-text");
          const spins = 10;
          for(let i=0; i<spins; i++) {
              tl.call(() => {
                  localTimeEl.innerText = `${Math.floor(Math.random()*12+1)}:${Math.floor(Math.random()*60).toString().padStart(2, '0')} ${Math.random() > 0.5 ? 'AM' : 'PM'}`;
              }, null, `timezoneSync+=${2.7 + i*0.1}`);
          }

          // Lock onto final time
          tl.call(() => {
              localTimeEl.innerText = "3:30 PM";
          }, null, `timezoneSync+=${2.7 + spins*0.1}`);

          // Badge pops in
          tl.to("#tz-badge", {
              scale: 1,
              opacity: 1,
              duration: 0.8,
              ease: "back.out(2)"
          }, `timezoneSync+=${2.8 + spins*0.1}`);

          // Infinite Float
          tl.to("#world-stage", {
              y: -15,
              duration: 3,
              yoyo: true,
              repeat: -1,
              ease: "sine.inOut"
          }, `timezoneSync+=${3.5 + spins*0.1}`);
    };
    </script>
</body>
</html>
