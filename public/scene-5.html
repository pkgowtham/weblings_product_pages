<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weblings Worksuite - Scene 5 (Specific HR Collision & Timezone Toggle)</title>
    <!-- GSAP via CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/CustomEase.min.js"></script>

    <style>
        :root {
            --brand-blue: #0072C4;
            --surface-lighter: #E6F2FF;
            --surface-inverse: #262626;
            --green-accent: #10B981;
            --slate-navy: #0F172A;
            --purple: #9333EA;
            --bg-light: #F4F6F9;
            --surface-white: #ffffff;
            --border-light: #d9d9d9;
            --text-dark: #262626;
            --text-gray: #595959;
            --red-badge: #EF4444;
            --red-bg: #FEF2F2;
        }

        * { box-sizing: border-box; }

        body, html {
            margin: 0;
            padding: 0;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
            background: var(--bg-light) !important;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        .overlay, .mask, body::before, body::after, #world-stage::before, #world-stage::after {
            display: none !important;
        }

        #viewport {
            width: 100vw;
            height: 100vh;
            perspective: 1200px;
            transform-style: preserve-3d;
            position: relative;
            overflow: hidden;
        }

        #ambient-bg {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 150vw;
            height: 150vh;
            transform: translate(-50%, -50%);
            background: radial-gradient(circle at center, var(--surface-lighter) 0%, rgba(0, 114, 196, 0.05) 50%, transparent 100%);
            border-radius: 50%;
            filter: blur(80px);
            z-index: 0;
            pointer-events: none;
        }

        #world-stage {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            transform-style: preserve-3d;
            z-index: 10;
            will-change: transform;
        }

        /* Iframe Styles */
        .iframe-wrapper {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 1440px;
            height: 900px;
            margin-top: -450px;
            margin-left: -720px;
            border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.1);
            box-shadow: 0 40px 100px rgba(0,0,0,0.4);
            overflow: hidden;
            background: var(--surface-white);
            will-change: filter;
            transform-style: preserve-3d;
        }

        .iframe-content {
            width: 1440px;
            height: 2500px;
            border: none;
            pointer-events: none;
            transform-origin: center center;
            transform: translateY(-800px); /* Pre-scrolled */
        }

        .iframe-content::-webkit-scrollbar {
            display: none;
        }

        /* 3D Overlays Layer */
        .overlay-layer {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            transform-style: preserve-3d;
        }

        /* Sprint Block Overlay */
        .sprint-block {
            position: absolute;
            top: 40%;
            left: 30%;
            width: 300px;
            height: 70px;
            background: var(--purple);
            color: white;
            border-radius: 8px;
            display: flex;
            align-items: center;
            padding: 0 20px;
            font-size: 1.2rem;
            font-weight: bold;
            box-shadow: 0 10px 30px rgba(147, 51, 234, 0.4);
            z-index: 20;
            will-change: transform, box-shadow;
        }

        /* HR Warning Modal */
        .hr-modal {
            position: absolute;
            top: 50%; left: 50%;
            width: 600px;
            margin-top: -150px;
            margin-left: -300px;
            background: rgba(254, 242, 242, 0.95);
            backdrop-filter: blur(10px);
            border: 2px solid var(--red-badge);
            border-radius: 16px;
            padding: 40px;
            text-align: center;
            box-shadow: 0 30px 60px rgba(239, 68, 68, 0.5), 0 0 50px rgba(239, 68, 68, 0.3);
            z-index: 50;
            opacity: 0;
            transform: scale(0) translateZ(300px);
            will-change: transform, opacity;
        }

        .warning-icon {
            font-size: 50px;
            margin-bottom: 20px;
        }

        .hr-text {
            color: #7F1D1D;
            font-size: 1.5rem;
            font-weight: 700;
            line-height: 1.4;
        }

        /* Timezone Badge Overlay */
        .tz-badge {
            position: absolute;
            top: -40px; /* Above the sprint block */
            left: 50%;
            margin-left: -125px; /* Centers 250px width */
            width: 250px;
            height: 40px;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid var(--border-light);
            border-radius: 20px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.15);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 30;
            opacity: 0;
            transform: scale(0);
            will-change: transform, opacity, box-shadow;
            overflow: hidden;
        }

        .tz-slot-container {
            height: 24px; /* match line height */
            overflow: hidden;
            position: relative;
            width: 100%;
        }

        .tz-slots {
            display: flex;
            flex-direction: column;
            position: absolute;
            top: 0; left: 0; width: 100%;
            text-align: center;
            will-change: transform;
        }

        .tz-slot {
            height: 24px;
            line-height: 24px;
            font-weight: bold;
            font-size: 1.1rem;
            color: var(--text-dark);
            white-space: nowrap;
        }

        /* Virtual Cursor */
        #virtual-cursor {
            position: absolute;
            width: 32px;
            height: 32px;
            z-index: 999;
            opacity: 0;
            transform: translate(100vw, 100vh);
            will-change: transform, opacity;
            pointer-events: none;
        }

    </style>
</head>
<body>

    <div id="viewport">
        <div id="ambient-bg"></div>

        <div id="world-stage">

            <div id="calendar-wrapper" class="iframe-wrapper">
                <iframe id="calendar-frame" class="iframe-content" src="http://localhost:3000/calendar"></iframe>

                <!-- Sprint Block inside wrapper to match coordinate space visually -->
                <div class="sprint-block" id="sprint-block">
                    STR-104: Sprint Block
                    <div class="tz-badge" id="tz-badge">
                        <div class="tz-slot-container">
                            <div class="tz-slots" id="tz-slots">
                                <div class="tz-slot">10:00 AM (IST)</div>
                                <div class="tz-slot">04:30 AM (GMT)</div>
                                <div class="tz-slot">11:30 PM (EST)</div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="overlay-layer">
                <!-- Specific HR Warning Modal -->
                <div class="hr-modal" id="hr-modal">
                    <div class="warning-icon">⚠️</div>
                    <div class="hr-text">Warning: Lead Dev Alex Turner is on approved PTO from Oct 12–15 (Synced from E-Office)</div>
                </div>
            </div>

        </div>

        <!-- Virtual Cursor -->
        <svg id="virtual-cursor" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M5.5 3.21V20.8c0 .45.54.67.85.35l4.86-4.86a.5.5 0 0 1 .35-.15h6.94c.45 0 .67-.54.35-.85L5.85 2.86a.5.5 0 0 0-.85.35Z" fill="#111827" stroke="#ffffff" stroke-width="2"/>
        </svg>

    </div>

    <script>
    window.onload = () => {
        gsap.registerPlugin(CustomEase);

        const tl = gsap.timeline();

        // --- BEAT 1: The Sprint Block Drag (0.0s - 6.0s) ---
        tl.addLabel("sprintDrag", 0)
          // Camera pushes in slightly
          .fromTo("#world-stage",
              { scale: 1 },
              { scale: 1.05, duration: 2.0, ease: "power2.inOut" },
              "sprintDrag"
          )

          // Cursor sweeps in to center of block
          // Wrapper top/left roughly matches screen center.
          .to("#virtual-cursor", {
              x: window.innerWidth/2 - 720 + (1440 * 0.3) + 150, // Block is left 30% of 1440 wrapper, center of 300px block
              y: window.innerHeight/2 - 450 + (900 * 0.4) + 35,  // Block is top 40% of 900 wrapper, center of 70px block
              opacity: 1,
              duration: 1.5,
              ease: "power2.out"
          }, "sprintDrag+=1.0")

          // Click block
          .to("#virtual-cursor", { scale: 0.9, duration: 0.1 }, "sprintDrag+=2.6")
          .to("#sprint-block", { scale: 1.05, boxShadow: "0 20px 50px rgba(147, 51, 234, 0.6)", z: 50, duration: 0.1 }, "sprintDrag+=2.6")

          // Drag across screen horizontally
          .to(["#virtual-cursor", "#sprint-block"], {
              x: "+=400", // Drag right
              duration: 2.0,
              ease: "power2.inOut"
          }, "sprintDrag+=2.8")

          // Drop block
          .to("#virtual-cursor", { scale: 1, duration: 0.1 }, "sprintDrag+=4.9")
          .to("#sprint-block", { scale: 1, boxShadow: "0 10px 30px rgba(147, 51, 234, 0.4)", z: 0, duration: 0.1 }, "sprintDrag+=4.9");

        // --- BEAT 2: The Specific HR Collision (6.0s - 12.0s) ---
        tl.addLabel("hrCollision", 6.0)
          // Cursor moves away
          .to("#virtual-cursor", { x: "+=100", y: "+=100", opacity: 0, duration: 1.0 }, "hrCollision")

          // Iframe background blurs aggressively
          .to("#calendar-wrapper", {
              filter: "blur(8px)",
              duration: 0.5,
              ease: "power2.out"
          }, "hrCollision")

          // Modal violently scales up
          .fromTo("#hr-modal",
              { scale: 0, opacity: 0 },
              { scale: 1, opacity: 1, duration: 1.2, ease: "elastic.out(1, 0.5)" },
              "hrCollision+=0.2"
          );

        // --- BEAT 3: The Timezone Normalization Toggle (12.0s - 20.0s) ---
        tl.addLabel("timezoneToggle", 12.0)
          // Red warning modal dissolves
          .to("#hr-modal", {
              scale: 0.8,
              opacity: 0,
              duration: 0.8,
              ease: "power2.in"
          }, "timezoneToggle")

          // Iframe unblurs
          .to("#calendar-wrapper", {
              filter: "blur(0px)",
              duration: 0.8,
              ease: "power2.out"
          }, "timezoneToggle")

          // Timezone badge scales up attached to sprint block
          .to("#tz-badge", {
              scale: 1,
              opacity: 1,
              duration: 0.8,
              ease: "back.out(1.5)"
          }, "timezoneToggle+=0.5")

          // Slot machine vertical text reveal
          // Slot 1 (IST) is y: 0.
          // Slot 2 (GMT) is y: -24.
          // Slot 3 (EST) is y: -48.

          // Cycle to GMT
          .to("#tz-slots", {
              y: -24,
              duration: 0.4,
              ease: "back.inOut(1.5)"
          }, "timezoneToggle+=1.8")

          // Cycle to EST
          .to("#tz-slots", {
              y: -48,
              duration: 0.4,
              ease: "back.inOut(1.5)"
          }, "timezoneToggle+=2.8")

          // Hold and Glow on EST
          .to("#tz-badge", {
              boxShadow: "0 0 20px rgba(16, 185, 129, 0.6)", // Green accent glow
              borderColor: "var(--green-accent)",
              duration: 1.0,
              ease: "power2.out"
          }, "timezoneToggle+=3.2")

          // Infinite gentle 3D float
          .to("#world-stage", {
              y: -15,
              duration: 3,
              yoyo: true,
              repeat: -1,
              ease: "sine.inOut"
          }, "timezoneToggle+=4.0");

    };
    </script>
</body>
</html>
