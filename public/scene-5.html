<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weblings Worksuite - Scene 5 (Static Highlight)</title>
    <!-- GSAP via CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/CustomEase.min.js"></script>

    <style>
        :root {
            --brand-blue: #0072C4;
            --surface-lighter: #E6F2FF;
            --surface-inverse: #262626;
            --green-accent: #10B981;
            --slate-navy: #0F172A;
            --purple: #9333EA;
            --bg-light: #F4F6F9;
            --surface-white: #ffffff;
            --border-light: #d9d9d9;
            --text-dark: #262626;
            --text-gray: #595959;
            --red-badge: #EF4444;
            --red-bg: #FEF2F2;
        }

        * { box-sizing: border-box; }

        body, html {
            margin: 0;
            padding: 0;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
            background: var(--bg-light) !important;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        .overlay, .mask, body::before, body::after, #world-stage::before, #world-stage::after {
            display: none !important;
        }

        #viewport {
            width: 100vw;
            height: 100vh;
            perspective: 1200px;
            transform-style: preserve-3d;
            position: relative;
            overflow: hidden;
        }

        #ambient-bg {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 150vw;
            height: 150vh;
            transform: translate(-50%, -50%);
            background: radial-gradient(circle at center, var(--surface-lighter) 0%, rgba(0, 114, 196, 0.05) 50%, transparent 100%);
            border-radius: 50%;
            filter: blur(80px);
            z-index: 0;
            pointer-events: none;
        }

        #world-stage {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            transform-style: preserve-3d;
            z-index: 10;
            will-change: transform;
        }

        /* Iframe Styles */
        .iframe-wrapper {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 1440px;
            height: 900px;
            margin-top: -450px;
            margin-left: -720px;
            border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.1);
            box-shadow: 0 40px 100px rgba(0,0,0,0.4);
            overflow: hidden;
            background: var(--surface-white);
            will-change: filter, transform;
            transform-style: preserve-3d;
        }

        .iframe-content {
            width: 1440px;
            height: 2500px; /* Tall to allow scrolling */
            border: none;
            pointer-events: none;
            transform-origin: center center;
            will-change: transform;
        }

        .iframe-content::-webkit-scrollbar {
            display: none;
        }

        /* 3D Overlays Layer */
        .overlay-layer {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            transform-style: preserve-3d;
        }

        /* HR Warning Shield Modal */
        .warning-modal {
            position: absolute;
            top: 50%; left: 50%;
            width: 600px;
            margin-top: -150px;
            margin-left: -300px;
            background: rgba(254, 242, 242, 0.95); /* red-bg slightly glass */
            backdrop-filter: blur(10px);
            border: 2px solid var(--red-badge);
            border-radius: 16px;
            padding: 40px;
            text-align: center;
            box-shadow: 0 30px 60px rgba(239, 68, 68, 0.4), 0 0 50px rgba(239, 68, 68, 0.2);
            z-index: 50;
            opacity: 0;
            transform: scale(0) translateZ(300px);
            will-change: transform, opacity;
        }

        .warning-icon {
            font-size: 60px;
            margin-bottom: 20px;
            filter: drop-shadow(0 10px 10px rgba(239, 68, 68, 0.3));
        }

        .warning-text {
            color: #7F1D1D;
            font-size: 2rem;
            font-weight: 800;
            line-height: 1.2;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* Ecosystem Sync Badges */
        .sync-badge {
            position: absolute;
            top: 50%;
            left: 50%;
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.4);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.15);
            border-radius: 16px;
            padding: 16px 32px;
            font-size: 1.3rem;
            font-weight: bold;
            color: var(--text-dark);
            z-index: 40;
            opacity: 0;
            transform: scale(0) translateZ(-500px); /* Start small and deep */
            will-change: transform, opacity;
        }

        #badge-google {
            margin-top: -30px;
            margin-left: -350px;
        }

        #badge-outlook {
            margin-top: -30px;
            margin-left: 100px;
        }

        /* SVG Pulse Line */
        .sync-line-container {
            position: absolute;
            top: 50%; left: 50%;
            margin-top: -10px;
            margin-left: -150px; /* Bridge the gap between badges */
            width: 250px;
            height: 20px;
            z-index: 35;
            opacity: 0;
            transform: translateZ(200px);
        }

        .sync-line {
            stroke: var(--green-accent);
            stroke-width: 4;
            stroke-linecap: round;
            stroke-dasharray: 10 10;
            animation: dash 1s linear infinite;
            filter: drop-shadow(0 0 10px var(--green-accent));
        }

        @keyframes dash {
            to {
                stroke-dashoffset: -20;
            }
        }

    </style>
</head>
<body>

    <div id="viewport">
        <div id="ambient-bg"></div>

        <div id="world-stage">

            <div id="calendar-wrapper" class="iframe-wrapper">
                <iframe id="calendar-frame" class="iframe-content" src="http://localhost:3000/calendar"></iframe>
            </div>

            <div class="overlay-layer">

                <!-- Warning Shield -->
                <div class="warning-modal" id="warning-shield">
                    <div class="warning-icon">🛡️</div>
                    <div class="warning-text">HR CAPACITY WARNING<br><span style="font-size: 1.2rem; font-weight: 600; color: #B91C1C;">Assignee on leave</span></div>
                </div>

                <!-- Ecosystem Sync -->
                <div class="sync-badge" id="badge-google">Google Calendar</div>

                <svg class="sync-line-container" id="sync-pulse" viewBox="0 0 250 20">
                    <line x1="0" y1="10" x2="250" y2="10" class="sync-line" />
                </svg>

                <div class="sync-badge" id="badge-outlook">Outlook / M365</div>

            </div>

        </div>

    </div>

    <script>
    window.onload = () => {
        gsap.registerPlugin(CustomEase);

        const tl = gsap.timeline();

        // --- BEAT 1: The Hero Reveal (0.0s - 5.0s) ---
        tl.addLabel("heroReveal", 0)
          // Camera pushes in from slight angle
          .fromTo("#world-stage",
              { rotationX: 10, scale: 0.9 },
              { rotationX: 0, scale: 1, duration: 5.0, ease: "power2.inOut" },
              "heroReveal"
          );

        // --- BEAT 2: The HR Collision Scroll (5.0s - 12.0s) ---
        tl.addLabel("hrScroll", 5.0)
          // Scroll iframe to "Reality Check"
          .to("#calendar-frame", {
              y: -800,
              duration: 4.0,
              ease: "power2.inOut"
          }, "hrScroll")
          // Blur iframe slightly
          .to("#calendar-wrapper", {
              filter: "blur(4px)",
              duration: 1.0,
              ease: "power2.inOut"
          }, "hrScroll+=3.5")
          // Massive 3D red warning shield pops up
          .fromTo("#warning-shield",
              { scale: 0, opacity: 0 },
              { scale: 1, opacity: 1, duration: 1.5, ease: "elastic.out(1, 0.5)" },
              "hrScroll+=3.8"
          )
          // Small yoyo float on shield to keep it alive
          .to("#warning-shield", {
              y: -10,
              duration: 2.0,
              yoyo: true,
              repeat: 1,
              ease: "sine.inOut"
          }, "hrScroll+=4.0");

        // --- BEAT 3: The Ecosystem Sync (12.0s - 20.0s) ---
        tl.addLabel("ecosystemSync", 12.0)
          // Warning shield flies off
          .to("#warning-shield", {
              y: -1000,
              opacity: 0,
              duration: 0.8,
              ease: "power3.in"
          }, "ecosystemSync")
          // Remove blur
          .to("#calendar-wrapper", { filter: "blur(0px)", duration: 0.5 }, "ecosystemSync")

          // Scroll to "Reality Check" (2-Way External Sync)
          .to("#calendar-frame", {
              y: -1200,
              duration: 2.5,
              ease: "power2.inOut"
          }, "ecosystemSync+=0.5")

          // Camera zooms tightly
          .to("#world-stage", {
              scale: 1.15,
              duration: 2.0,
              ease: "power2.inOut"
          }, "ecosystemSync+=1.0")

          // Badges fly out toward camera
          .fromTo(["#badge-google", "#badge-outlook"],
              { scale: 0, opacity: 0, z: -500 },
              { scale: 1, opacity: 1, z: 200, duration: 1.5, stagger: 0.2, ease: "back.out(1.5)" },
              "ecosystemSync+=2.5"
          )

          // Pulse line appears
          .to("#sync-pulse", {
              opacity: 1,
              duration: 0.5
          }, "ecosystemSync+=3.5")

          // Infinite Float
          .to("#world-stage", {
              y: -15,
              duration: 3,
              yoyo: true,
              repeat: -1,
              ease: "sine.inOut"
          }, "ecosystemSync+=4.0");
    };
    </script>
</body>
</html>
