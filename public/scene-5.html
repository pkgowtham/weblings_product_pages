<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weblings Worksuite - Scene 5 (Combo Finale)</title>
    <!-- GSAP via CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/CustomEase.min.js"></script>
    
    <style>
        :root {
            --brand-blue: #0072C4;
            --surface-lighter: #E6F2FF;
            --surface-inverse: #262626;
            --green-accent: #10B981; 
            --slate-navy: #0F172A; 
            --purple: #9333EA; 
            --bg-light: #F4F6F9; 
            --surface-white: #ffffff;
            --border-light: #d9d9d9;
            --text-dark: #262626;
            --text-gray: #595959;
            --red-badge: #EF4444;
            --red-bg: #FEF2F2;
        }

        * { box-sizing: border-box; }

        body, html {
            margin: 0;
            padding: 0;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
            background: var(--bg-light) !important;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        .overlay, .mask, body::before, body::after, #world-stage::before, #world-stage::after {
            display: none !important;
        }

        #viewport {
            width: 100vw;
            height: 100vh;
            perspective: 1200px;
            transform-style: preserve-3d;
            position: relative;
            overflow: hidden;
        }
        
        #ambient-bg {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 150vw;
            height: 150vh;
            transform: translate(-50%, -50%);
            background: radial-gradient(circle at center, var(--surface-lighter) 0%, rgba(0, 114, 196, 0.05) 50%, transparent 100%);
            border-radius: 50%;
            filter: blur(80px);
            z-index: 0;
            pointer-events: none;
        }

        #world-stage {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            transform-style: preserve-3d;
            z-index: 10;
            will-change: transform;
        }

        /* Iframe Styles */
        .iframe-wrapper {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 1440px;
            height: 900px;
            margin-top: -450px;
            margin-left: -720px;
            border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.1);
            box-shadow: 0 40px 100px rgba(0,0,0,0.4);
            overflow: hidden;
            background: var(--surface-white);
            will-change: filter, transform;
            transform-style: preserve-3d;
        }

        .iframe-content {
            width: 1440px;
            height: 2500px;
            border: none;
            pointer-events: none;
            transform-origin: center center;
            will-change: transform;
        }
        
        .iframe-content::-webkit-scrollbar {
            display: none;
        }

        /* 3D Overlays Layer */
        .overlay-layer {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            transform-style: preserve-3d;
        }

        /* Sprint Block Overlay */
        .sprint-block {
            position: absolute;
            top: 40%;
            left: 30%;
            width: 300px;
            height: 70px;
            background: var(--purple);
            color: white;
            border-radius: 8px;
            display: flex;
            align-items: center;
            padding: 0 20px;
            font-size: 1.2rem;
            font-weight: bold;
            box-shadow: 0 10px 30px rgba(147, 51, 234, 0.4);
            z-index: 20;
            will-change: transform, box-shadow, opacity;
        }

        /* HR Warning Modal */
        .hr-modal {
            position: absolute;
            top: 50%; left: 50%;
            width: 600px;
            margin-top: -150px;
            margin-left: -300px;
            background: rgba(254, 242, 242, 0.95);
            backdrop-filter: blur(10px);
            border: 2px solid var(--red-badge);
            border-radius: 16px;
            padding: 40px;
            text-align: center;
            box-shadow: 0 30px 60px rgba(239, 68, 68, 0.5), 0 0 50px rgba(239, 68, 68, 0.3);
            z-index: 50;
            opacity: 0;
            transform: scale(0) translateZ(300px);
            will-change: transform, opacity;
        }

        .warning-icon {
            font-size: 50px;
            margin-bottom: 20px;
        }

        .hr-text {
            color: #7F1D1D;
            font-size: 1.5rem;
            font-weight: 700;
            line-height: 1.4;
        }

        /* Timezone Badge Overlay */
        .tz-badge {
            position: absolute;
            top: -40px; /* Above the sprint block */
            left: 50%;
            margin-left: -125px; /* Centers 250px width */
            width: 250px;
            height: 40px;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid var(--border-light);
            border-radius: 20px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.15);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 30;
            opacity: 0;
            transform: scale(0);
            will-change: transform, opacity, box-shadow;
            overflow: hidden;
        }

        .tz-slot-container {
            height: 24px; /* match line height */
            overflow: hidden;
            position: relative;
            width: 100%;
        }

        .tz-slots {
            display: flex;
            flex-direction: column;
            position: absolute;
            top: 0; left: 0; width: 100%;
            text-align: center;
            will-change: transform;
        }

        .tz-slot {
            height: 24px;
            line-height: 24px;
            font-weight: bold;
            font-size: 1.1rem;
            color: var(--text-dark);
            white-space: nowrap;
        }

        /* AI Flipper Container */
        .ai-flipper-container {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 450px;
            height: 180px;
            margin-top: -90px;
            margin-left: -225px;
            perspective: 1200px;
            z-index: 60;
            opacity: 0;
            transform: scale(0) translateZ(200px);
            will-change: transform, opacity;
        }

        .ai-flipper {
            width: 100%;
            height: 100%;
            position: relative;
            transform-style: preserve-3d;
            will-change: transform;
        }

        .face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            border-radius: 16px;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.15);
            overflow: hidden;
        }

        /* Front: Transcript Bubble */
        .face-front {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.5);
            padding: 30px 40px;
            display: flex;
            align-items: center;
        }

        .transcript-text {
            font-size: 1.4rem;
            font-weight: 600;
            color: var(--text-dark);
            line-height: 1.4;
            position: relative;
            z-index: 2;
        }

        .ai-sparkle {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 32px;
            height: 32px;
            fill: var(--purple);
            opacity: 0;
            z-index: 3;
            will-change: transform, opacity;
        }

        .ai-scan-line {
            position: absolute;
            top: 0;
            left: -100px;
            width: 100px;
            height: 100%;
            background: linear-gradient(to right, transparent, rgba(147, 51, 234, 0.4), transparent);
            filter: blur(5px);
            z-index: 1;
            transform: skewX(-20deg);
        }

        /* Back: Agile Ticket */
        .face-back {
            background: white;
            border: 1px solid var(--border-light);
            transform: rotateY(180deg);
            padding: 25px 30px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 15px;
        }

        .ticket-header-ai {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .ticket-id-ai {
            font-size: 1.1rem;
            color: var(--text-gray);
            font-weight: 600;
        }

        .ticket-badge-ai {
            background: var(--surface-lighter);
            color: var(--green-accent);
            font-size: 0.9rem;
            padding: 6px 12px;
            border-radius: 6px;
            font-weight: bold;
            border: 1px solid rgba(16, 185, 129, 0.2);
        }

        .ticket-title-ai {
            font-size: 1.5rem;
            font-weight: 800;
            color: var(--text-dark);
            line-height: 1.2;
        }

        /* Virtual Cursor */
        #virtual-cursor {
            position: absolute;
            width: 32px;
            height: 32px;
            z-index: 999;
            opacity: 0;
            transform: translate(100vw, 100vh);
            will-change: transform, opacity;
            pointer-events: none;
        }

    </style>
</head>
<body>
    
    <div id="viewport">
        <div id="ambient-bg"></div>
        
        <div id="world-stage">
            
            <div id="calendar-wrapper" class="iframe-wrapper">
                <iframe id="calendar-frame" class="iframe-content" src="http://localhost:3000/calender"></iframe>
                
                <!-- Sprint Block inside wrapper -->
                <div class="sprint-block" id="sprint-block">
                    STR-104: Sprint Block
                    <div class="tz-badge" id="tz-badge">
                        <div class="tz-slot-container">
                            <div class="tz-slots" id="tz-slots">
                                <div class="tz-slot">10:00 AM (IST)</div>
                                <div class="tz-slot">04:30 AM (GMT)</div>
                                <div class="tz-slot">11:30 PM (EST)</div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            
            <div class="overlay-layer">
                
                <!-- Specific HR Warning Modal -->
                <div class="hr-modal" id="hr-modal">
                    <div class="warning-icon">⚠️</div>
                    <div class="hr-text">Warning: Lead Dev Alex Turner is on approved PTO from Oct 12–15 (Synced from E-Office)</div>
                </div>

                <!-- AI Flipper -->
                <div class="ai-flipper-container" id="ai-container">
                    <div class="ai-flipper" id="ai-flipper">
                        <div class="face face-front">
                            <div class="ai-scan-line" id="ai-scan"></div>
                            <svg class="ai-sparkle" id="sparkle" viewBox="0 0 24 24">
                                <path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/>
                            </svg>
                            <div class="transcript-text">"Client: We need to upgrade the payment gateway."</div>
                        </div>
                        
                        <div class="face face-back">
                            <div class="ticket-header-ai">
                                <span class="ticket-id-ai">STR-410</span>
                                <span class="ticket-badge-ai">Auto-Generated</span>
                            </div>
                            <div class="ticket-title-ai">Upgrade Payment Gateway</div>
                        </div>
                    </div>
                </div>
                
            </div>
            
        </div>
        
        <!-- Virtual Cursor -->
        <svg id="virtual-cursor" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M5.5 3.21V20.8c0 .45.54.67.85.35l4.86-4.86a.5.5 0 0 1 .35-.15h6.94c.45 0 .67-.54.35-.85L5.85 2.86a.5.5 0 0 0-.85.35Z" fill="#111827" stroke="#ffffff" stroke-width="2"/>
        </svg>

    </div>

    <script>
    window.onload = () => {
        gsap.registerPlugin(CustomEase);

        const tl = gsap.timeline();
        
        // --- BEAT 1: The Scroll & Sprint Drag (0.0s - 5.0s) ---
        tl.addLabel("sprintDrag", 0)
          // Instantly animate calendar to y: -600
          .to("#calendar-frame", {
              y: -600,
              duration: 2.0,
              ease: "power2.inOut"
          }, "sprintDrag")
          
          // Cursor sweeps in to center of block
          .to("#virtual-cursor", {
              x: window.innerWidth/2 - 720 + (1440 * 0.3) + 150,
              y: window.innerHeight/2 - 450 + (900 * 0.4) + 35,
              opacity: 1,
              duration: 1.5,
              ease: "power2.out"
          }, "sprintDrag+=2.0")
          
          // Click block
          .to("#virtual-cursor", { scale: 0.9, duration: 0.1 }, "sprintDrag+=3.6")
          .to("#sprint-block", { scale: 1.05, boxShadow: "0 20px 50px rgba(147, 51, 234, 0.6)", z: 50, duration: 0.1 }, "sprintDrag+=3.6")
          
          // Drag across screen horizontally
          .to(["#virtual-cursor", "#sprint-block"], {
              x: "+=400", // Drag right
              duration: 1.2,
              ease: "power2.inOut"
          }, "sprintDrag+=3.8")
          
          // Drop block
          .to("#virtual-cursor", { scale: 1, duration: 0.1 }, "sprintDrag+=5.0")
          .to("#sprint-block", { scale: 1, boxShadow: "0 10px 30px rgba(147, 51, 234, 0.4)", z: 0, duration: 0.1 }, "sprintDrag+=5.0");

        // --- BEAT 2: Specific HR Warning & Timezone Toggle (5.0s - 12.0s) ---
        tl.addLabel("hrCollision", 5.0)
          // Cursor moves away
          .to("#virtual-cursor", { x: "+=100", y: "+=100", opacity: 0, duration: 1.0 }, "hrCollision")
          
          // Iframe blurs aggressively
          .to("#calendar-wrapper", {
              filter: "blur(8px)",
              duration: 0.5,
              ease: "power2.out"
          }, "hrCollision")
          
          // Modal violently scales up
          .fromTo("#hr-modal",
              { scale: 0, opacity: 0 },
              { scale: 1, opacity: 1, duration: 1.2, ease: "elastic.out(1, 0.5)" },
              "hrCollision+=0.2"
          )
          
          // Timezone Toggle Sequence (Starts at 8.0s roughly)
          // Red warning modal dissolves
          .to("#hr-modal", {
              scale: 0.8,
              opacity: 0,
              duration: 0.8,
              ease: "power2.in"
          }, "hrCollision+=3.0")
          
          // Iframe unblurs
          .to("#calendar-wrapper", {
              filter: "blur(0px)",
              duration: 0.8,
              ease: "power2.out"
          }, "hrCollision+=3.0")
          
          // Timezone badge scales up
          .to("#tz-badge", {
              scale: 1,
              opacity: 1,
              duration: 0.8,
              ease: "back.out(1.5)"
          }, "hrCollision+=3.5")

          // Cycle to GMT
          .to("#tz-slots", {
              y: -24,
              duration: 0.4,
              ease: "back.inOut(1.5)"
          }, "hrCollision+=4.5")
          
          // Cycle to EST
          .to("#tz-slots", {
              y: -48,
              duration: 0.4,
              ease: "back.inOut(1.5)"
          }, "hrCollision+=5.5")

          // Glow on EST
          .to("#tz-badge", {
              boxShadow: "0 0 20px rgba(16, 185, 129, 0.6)",
              borderColor: "var(--green-accent)",
              duration: 1.0,
              ease: "power2.out"
          }, "hrCollision+=5.9");

        // --- BEAT 3: The AI Meeting-to-Ticket Reveal (12.0s - 22.0s) ---
        tl.addLabel("aiGen", 12.0)
          // Sprint block fades
          .to("#sprint-block", {
              opacity: 0,
              duration: 0.5
          }, "aiGen")
          
          // Scroll deeper down
          .to("#calendar-frame", {
              y: -1200,
              duration: 2.0,
              ease: "power2.inOut"
          }, "aiGen+=0.5")
          
          // Bubble scales up
          .fromTo("#ai-container",
              { scale: 0, opacity: 0 },
              { scale: 1, opacity: 1, duration: 1.2, ease: "back.out(1.5)" },
              "aiGen+=2.5"
          )
          
          // Sparkle appears & spins
          .to("#sparkle", {
              opacity: 1,
              rotation: 360,
              duration: 1.0,
              ease: "power1.inOut"
          }, "aiGen+=3.0")
          
          // Scan line sweeps across
          .to("#ai-scan", {
              left: "500px",
              duration: 1.2,
              ease: "power2.inOut"
          }, "aiGen+=3.2")
          
          // Sparkle fades
          .to("#sparkle", { opacity: 0, duration: 0.3 }, "aiGen+=4.2")

          // Violently flip on Y axis
          .to("#ai-flipper", {
              rotationY: 180,
              duration: 0.8,
              ease: "back.out(1.2)"
          }, "aiGen+=4.4")

          // Gentle 3D float
          .to("#world-stage", {
              y: -15,
              duration: 3,
              yoyo: true,
              repeat: -1,
              ease: "sine.inOut"
          }, "aiGen+=5.2");

    };
    </script>
</body>
</html>
