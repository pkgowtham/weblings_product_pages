<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weblings Worksuite - Scene 3</title>
    <!-- GSAP via CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/CustomEase.min.js"></script>

    <style>
        :root {
            --brand-blue: #0072C4;
            --surface-lighter: #E6F2FF;
            --surface-inverse: #262626;
            --green-accent: #10B981;
            --slate-navy: #0F172A;
            --purple: #9333EA;
            --bg-light: #F4F6F9;
            --surface-white: #ffffff;
            --border-light: #d9d9d9;
            --text-dark: #262626;
            --text-gray: #595959;
        }

        * { box-sizing: border-box; }

        body, html {
            margin: 0;
            padding: 0;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
            background: var(--bg-light) !important;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        .overlay, .mask, body::before, body::after, #world-stage::before, #world-stage::after {
            display: none !important;
        }

        #viewport {
            width: 100vw;
            height: 100vh;
            perspective: 1200px;
            transform-style: preserve-3d;
            position: relative;
            overflow: hidden;
        }

        #ambient-bg {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 150vw;
            height: 150vh;
            transform: translate(-50%, -50%);
            background: radial-gradient(circle at center, var(--surface-lighter) 0%, rgba(0, 114, 196, 0.05) 50%, transparent 100%);
            border-radius: 50%;
            filter: blur(80px);
            z-index: 0;
            pointer-events: none;
        }

        #world-stage {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            transform-style: preserve-3d;
            z-index: 10;
            will-change: transform;
        }

        /* Iframe Preloader */
        #preloader {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: var(--slate-navy);
            z-index: 9999;
            display: flex;
            align-items: center;
            justify-content: center;
            will-change: opacity;
        }

        .spinner {
            width: 60px;
            height: 60px;
            border: 4px solid rgba(255, 255, 255, 0.2);
            border-top: 4px solid #fff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        /* Iframe Styles */
        .iframe-wrapper {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 1440px;
            height: 900px;
            margin-top: -450px;
            margin-left: -720px;
            border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.1);
            box-shadow: 0 40px 100px rgba(0,0,0,0.4);
            overflow: hidden;
            background: var(--surface-white);
            will-change: filter;
        }

        .iframe-content {
            width: 1440px;
            height: 2500px;
            border: none;
            pointer-events: none;
            transform-origin: center center;
            will-change: transform;
        }

        .iframe-content::-webkit-scrollbar {
            display: none;
        }

        /* 3D Overlays Layer */
        .overlay-layer {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            transform-style: preserve-3d;
        }

        /* Ticket Replica */
        .ticket-replica {
            position: absolute;
            top: 50%; left: 50%;
            width: 380px;
            margin-top: -60px;
            margin-left: -190px;
            background: white;
            border-radius: 12px;
            border: 1px solid var(--border-light);
            padding: 20px;
            opacity: 0;
            transform: translateZ(50px);
            will-change: transform, opacity, box-shadow;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .ticket-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .ticket-id {
            font-size: 0.9rem;
            color: var(--text-gray);
            font-weight: 600;
        }

        .ticket-status {
            background: var(--surface-lighter);
            color: var(--brand-blue);
            font-size: 0.8rem;
            padding: 4px 8px;
            border-radius: 4px;
            font-weight: bold;
        }

        .ticket-title {
            font-size: 1.2rem;
            font-weight: bold;
            color: var(--text-dark);
        }

        /* Pipeline Assembly */
        .pipeline-container {
            position: absolute;
            top: 40%; left: 50%;
            margin-top: -50px;
            margin-left: -300px;
            width: 600px;
            height: 100px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transform-style: preserve-3d;
            transform: translateZ(200px);
            z-index: 20;
        }

        .node {
            width: 100px;
            height: 100px;
            background: rgba(15, 23, 42, 0.8); /* Slate Navy Glass */
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 2px solid rgba(255,255,255,0.2);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
            font-size: 1.1rem;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            opacity: 0;
            will-change: transform, opacity, background-color;
            position: relative;
            z-index: 2;
        }

        /* SVG Line */
        .pipeline-line-container {
            position: absolute;
            top: 50%; left: 50px;
            width: 500px;
            height: 4px;
            margin-top: -2px;
            z-index: 1;
            opacity: 0;
        }

        .pipeline-line {
            width: 100%;
            height: 100%;
            stroke: var(--slate-navy);
            stroke-width: 4;
            stroke-dasharray: 500;
            stroke-dashoffset: 500; /* Hidden initially */
            will-change: stroke-dashoffset;
        }

        /* Terminal Window */
        .terminal-window {
            position: absolute;
            top: 60%; left: 50%;
            margin-left: -350px;
            width: 700px;
            height: 250px;
            background: rgba(15, 23, 42, 0.95); /* Slate Navy */
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 12px;
            box-shadow: 0 30px 60px rgba(0,0,0,0.5);
            padding: 20px;
            color: #10B981; /* Green accent text */
            font-family: monospace;
            font-size: 1.1rem;
            line-height: 1.6;
            opacity: 0;
            transform: translateY(-1000px) translateZ(100px);
            will-change: transform, opacity;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .term-header {
            display: flex;
            gap: 8px;
            margin-bottom: 15px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            padding-bottom: 10px;
        }

        .term-dot {
            width: 12px; height: 12px; border-radius: 50%;
        }
        .term-dot.red { background: #EF4444; }
        .term-dot.yellow { background: #F59E0B; }
        .term-dot.green { background: #10B981; }

        .term-line {
            opacity: 0;
            will-change: opacity;
        }

    </style>
</head>
<body>
    <div id="preloader"><div class="spinner"></div></div>

    <div id="viewport">
        <div id="ambient-bg"></div>
        <div id="world-stage">

            <!-- Background Streamline App -->
            <div id="streamline-wrapper" class="iframe-wrapper">
                <iframe id="streamline-frame" class="iframe-content" src="http://localhost:3000/streamline"></iframe>
            </div>

            <div class="overlay-layer">
                <!-- Ticket Replica -->
                <div class="ticket-replica" id="ticket">
                    <div class="ticket-header">
                        <span class="ticket-id">PROJ-409</span>
                        <span class="ticket-status">In Progress</span>
                    </div>
                    <div class="ticket-title">Implement Stripe Gateway</div>
                </div>

                <!-- Pipeline Nodes and Line -->
                <div class="pipeline-container">
                    <div class="node node-build" id="node-build">Build</div>

                    <svg class="pipeline-line-container" id="pipe-line" preserveAspectRatio="none" viewBox="0 0 500 4">
                        <line x1="0" y1="2" x2="500" y2="2" class="pipeline-line" id="svg-line"/>
                    </svg>

                    <div class="node node-test" id="node-test">Test</div>
                    <div class="node node-deploy" id="node-deploy">Deploy</div>
                </div>

                <!-- Terminal -->
                <div class="terminal-window" id="terminal">
                    <div class="term-header">
                        <div class="term-dot red"></div>
                        <div class="term-dot yellow"></div>
                        <div class="term-dot green"></div>
                    </div>
                    <div class="term-line">> Starting pipeline for PROJ-409...</div>
                    <div class="term-line">> Running unit tests (452/452 passed)</div>
                    <div class="term-line">> Compiling assets and bundling...</div>
                    <div class="term-line">> Deploying to production cluster...</div>
                    <div class="term-line" style="color: #ffffff;">> Success! Gateway is live.</div>
                </div>
            </div>

        </div>
    </div>

    <script>
    document.addEventListener("DOMContentLoaded", () => {
        gsap.registerPlugin(CustomEase);

        // Initial setup
        gsap.set("#world-stage", { scale: 0.8 }); // Start slightly zoomed out

        const frame = document.getElementById("streamline-frame");

        // Iframe Preloader
        const loadPromise = new Promise(resolve => {
            if (frame.contentDocument && frame.contentDocument.readyState === 'complete') {
                resolve();
            } else {
                frame.addEventListener('load', resolve, { once: true });
                frame.addEventListener('error', resolve, { once: true });
            }
        });

        loadPromise.then(() => {
            // 3.5s Hydration Delay
            setTimeout(() => {
                const preloader = document.getElementById('preloader');
                gsap.to(preloader, {
                    opacity: 0,
                    duration: 0.5,
                    onComplete: () => {
                        preloader.style.display = 'none';
                        startAnimation();
                    }
                });
            }, 3500);
        });

        function startAnimation() {
            const tl = gsap.timeline();

            // --- BEAT 1: The Streamline Scroll & Ticket Hover (0.0s - 5.0s) ---
            tl.addLabel("streamlineScroll", 0)
              // Scroll the iframe
              .to("#streamline-frame", {
                  y: -500,
                  duration: 5,
                  ease: "none"
              }, "streamlineScroll")
              // Zoom deeply in at 4.0s
              .to("#world-stage", {
                  scale: 1.8,
                  duration: 1.5,
                  ease: "power3.inOut"
              }, "streamlineScroll+=4");

            // --- BEAT 2: The Ticket Extraction & Blur (5.0s - 9.0s) ---
            tl.addLabel("ticketExtract", 5.0)
              // Blur background aggressively
              .to("#streamline-wrapper", {
                  filter: "blur(15px)",
                  duration: 1.5,
                  ease: "power2.inOut"
              }, "ticketExtract")
              // Extract ticket
              .to("#ticket", {
                  opacity: 1,
                  scale: 1.5,
                  z: 300,
                  boxShadow: "0 50px 100px rgba(0,0,0,0.3)",
                  duration: 1.5,
                  ease: "back.out(1.5)"
              }, "ticketExtract");

            // --- BEAT 3: The 3D Pipeline Assembly (9.0s - 15.0s) ---
            tl.addLabel("pipelineAssemble", 9.0)
              // Ticket morphs/shrinks to reveal Build node
              .to("#ticket", {
                  scale: 0,
                  opacity: 0,
                  duration: 0.8,
                  ease: "power3.in"
              }, "pipelineAssemble")
              .to("#node-build", {
                  opacity: 1,
                  duration: 0.8,
                  ease: "back.out(1.5)"
              }, "pipelineAssemble+=0.4")

              // Test and Deploy shoot in from right
              .fromTo(["#node-test", "#node-deploy"],
                  { x: 1000, opacity: 0 },
                  { x: 0, opacity: 1, duration: 1.2, stagger: 0.2, ease: "back.out(1.5)" },
                  "pipelineAssemble+=0.6"
              )

              // Line draws itself
              .to("#pipe-line", { opacity: 1, duration: 0.1 }, "pipelineAssemble+=1.2")
              .to("#svg-line", {
                  strokeDashoffset: 0,
                  duration: 1.0,
                  ease: "power2.inOut"
              }, "pipelineAssemble+=1.2")

              // Terminal violent drop in
              .to("#terminal", {
                  y: 0,
                  rotationX: 0, // from -45 set in CSS, but wait CSS doesn't have rotationX, let's set it here
                  opacity: 1,
                  duration: 1.2,
                  ease: "bounce.out"
              }, "pipelineAssemble+=1.5");

            // Make sure terminal starts with rotationX -45 for the drop effect
            gsap.set("#terminal", { rotationX: -45 });

            // Terminal lines appear
            tl.to(".term-line", {
                opacity: 1,
                duration: 0.2,
                stagger: 0.4
            }, "pipelineAssemble+=2.5");

            // --- BEAT 4: The Green Resolution (15.0s - 20.0s) ---
            tl.addLabel("greenResolution", 15.0)
              // Nodes turn green sequentially
              .to("#node-build", { backgroundColor: "var(--green-accent)", borderColor: "var(--green-accent)", duration: 0.4 }, "greenResolution")
              .to("#node-test", { backgroundColor: "var(--green-accent)", borderColor: "var(--green-accent)", duration: 0.4 }, "greenResolution+=0.8")
              .to("#node-deploy", { backgroundColor: "var(--green-accent)", borderColor: "var(--green-accent)", duration: 0.4 }, "greenResolution+=1.6")

              // Line turns green smoothly
              .to("#svg-line", { stroke: "var(--green-accent)", duration: 1.6 }, "greenResolution")

              // Pulse deploy node
              .to("#node-deploy", {
                  scale: 1.1,
                  boxShadow: "0 0 30px rgba(16, 185, 129, 0.8)",
                  duration: 0.3,
                  yoyo: true,
                  repeat: 1
              }, "greenResolution+=2.0")

              // Gentle 3D float
              .to("#world-stage", {
                  y: -15,
                  rotationY: 2,
                  duration: 3,
                  yoyo: true,
                  repeat: -1,
                  ease: "sine.inOut"
              }, "greenResolution+=2.0");
        }
    });
    </script>
</body>
</html>
